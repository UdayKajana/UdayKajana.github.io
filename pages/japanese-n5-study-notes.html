<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本語 N5 Study Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F9; --surface:#FFFFFF; --ink:#18203A; --muted:#566079; --rule:#D8DEE9; --wash:#E8EDF5;
  --accent:#B3261E; --accent-ink:#FFFFFF;
  --kanji:#6A3FA3; --kana:#B5174F; --jp:#1F5CB8; --rom:#A04A08; --mean:#26722E;
  --serif:"Shippori Mincho B1","Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --bar-h:4.1rem;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10141D; --surface:#171C27; --ink:#E7EBF5; --muted:#A0AAC0; --rule:#2B3446; --wash:#1E2535;
    --accent:#E5594F; --accent-ink:#10141D;
    --kanji:#BCA2F2; --kana:#F58DB2; --jp:#8AB6FF; --rom:#F2A862; --mean:#88D691;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10141D; --surface:#171C27; --ink:#E7EBF5; --muted:#A0AAC0; --rule:#2B3446; --wash:#1E2535;
  --accent:#E5594F; --accent-ink:#10141D;
  --kanji:#BCA2F2; --kana:#F58DB2; --jp:#8AB6FF; --rom:#F2A862; --mean:#88D691;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(var(--bar-h) + env(safe-area-inset-top,0px) + .5rem);scroll-behavior:smooth}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--jp);outline-offset:2px;border-radius:4px}
ruby rt{font-size:.5em;color:var(--kana);font-weight:500}
.no-furi rt{display:none}
.no-rom .rm{display:none}
.no-ex .exs{display:none}
.study .m{filter:blur(6px);cursor:pointer;transition:filter .15s}
.study .m.show{filter:none}
[hidden]{display:none!important}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--rule);padding:.65rem 1rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;min-height:var(--bar-h)}
.bar .brand{font-family:var(--serif);font-weight:700;font-size:1.25rem;margin-right:.25rem;white-space:nowrap}
.search{flex:1 1 14rem;min-width:11rem;position:relative}
.search input{width:100%;padding:.55rem .8rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper)}
.search input::placeholder{color:var(--muted)}
.toggles{display:flex;gap:.4rem;flex-wrap:wrap}
.tg{border:1.5px solid var(--rule);background:var(--surface);border-radius:999px;padding:.35rem .85rem;cursor:pointer;font-size:.9rem;min-height:2.25rem}
.tg[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.jump{display:none;border:1.5px solid var(--rule);border-radius:8px;padding:.5rem;background:var(--paper);max-width:100%}
.prog{font-size:.9rem;color:var(--muted);white-space:nowrap}

/* shell */
.shell{display:grid;grid-template-columns:16.5rem minmax(0,1fr);align-items:start;max-width:84rem;margin:0 auto}
.nav{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top,0px));max-height:calc(100vh - var(--bar-h) - env(safe-area-inset-top,0px));overflow:auto;padding:1.25rem .75rem 2rem 1rem;font-size:.92rem}
.nav h4{margin:1.1rem 0 .3rem;font-size:.85rem;color:var(--muted);font-weight:700;letter-spacing:.02em}
.nav a{display:flex;justify-content:space-between;gap:.5rem;padding:.28rem .6rem;border-radius:6px;color:var(--ink);text-decoration:none;border-left:3px solid transparent}
.nav a:hover{background:var(--wash)}
.nav a.on{background:var(--wash);border-left-color:var(--accent);font-weight:700}
.nav a small{color:var(--muted)}
main{padding:1.25rem 1.25rem 5rem;min-width:0}
section.sec{margin:0 0 3.5rem}
section.sec>h2{font-family:var(--serif);font-weight:700;font-size:1.9rem;line-height:1.25;margin:0 0 .35rem;display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap}
section.sec>h2 .cnt{font-family:var(--sans);font-size:.9rem;color:var(--muted);font-weight:500}
.lede{max-width:46rem;color:var(--muted);margin:0 0 1.25rem}
h3{font-family:var(--serif);font-size:1.3rem;margin:2rem 0 .5rem}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:center;padding:1.5rem 0 2rem;border-bottom:1px solid var(--rule);margin-bottom:2.5rem}
.hero h1{font-family:var(--serif);font-size:clamp(2.6rem,7vw,4.6rem);line-height:1.05;margin:0 0 .6rem;font-weight:700;color:var(--kanji)}
.hero p{margin:0;max-width:40rem;font-size:1.1rem}
.stamp{width:7.5rem;height:7.5rem;border:5px solid var(--accent);border-radius:10px;color:var(--accent);display:grid;place-items:center;font-family:var(--serif);font-size:5rem;font-weight:700;transform:rotate(-5deg);line-height:1;background:transparent}
.stats{display:flex;gap:1.75rem;flex-wrap:wrap;margin-top:1.25rem}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--serif);font-size:1.7rem;line-height:1.1}
.stats span{font-size:.85rem;color:var(--muted)}

/* legend and facts */
.legend{display:flex;flex-wrap:wrap;gap:.5rem .75rem;margin:1rem 0}
.legend span{display:inline-flex;align-items:center;gap:.4rem;padding:.25rem .7rem;border:1.5px solid currentColor;border-radius:999px;font-size:.92rem;background:var(--surface)}
.c-kanji{color:var(--kanji)}.c-kana{color:var(--kana)}.c-jp{color:var(--jp)}.c-rom{color:var(--rom)}.c-mean{color:var(--mean)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem;margin:1rem 0}
.fact{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:1rem 1.1rem}
.fact h4{margin:0 0 .35rem;font-family:var(--serif);font-size:1.1rem}
.fact p{margin:0;font-size:.95rem}
details.chg{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:.8rem 1.1rem;margin-top:1rem}
details.chg summary{cursor:pointer;font-weight:700}
details.chg ul{margin:.6rem 0 0;padding-left:1.2rem}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:.4rem .9rem;cursor:pointer;margin-top:.8rem}

/* vocab entries */
.entries{list-style:none;margin:0;padding:0;border-bottom:1px solid var(--rule)}
.entry{display:grid;grid-template-columns:1.6rem 11.5rem minmax(0,1fr);gap:.2rem 1rem;padding:.85rem 0;border-top:1px solid var(--rule)}
.chk{display:flex;padding-top:.45rem}
.chk input{width:1.15rem;height:1.15rem;accent-color:var(--mean);cursor:pointer}
.entry.done .head,.entry.done .body{opacity:.55}
.head .w{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.kj{font-family:var(--serif);font-weight:700;font-size:1.6rem;line-height:1.25;color:var(--kanji)}
.kn{color:var(--kana);font-size:1rem}
.rm{color:var(--rom);font-size:.92rem}
.m{color:var(--mean)}
.mean{font-weight:500;font-size:1.02rem}
.tagb{display:inline-block;font-size:.78rem;border:1px solid var(--rule);color:var(--muted);border-radius:5px;padding:0 .4rem;margin-left:.35rem;font-weight:400}
.masu{font-size:.92rem;margin-top:.15rem}
.masu .kj{font-size:1.05rem;font-weight:500}
.say{border:0;background:transparent;color:var(--muted);padding:.2rem;cursor:pointer;border-radius:6px;display:inline-flex}
.say:hover{color:var(--jp);background:var(--wash)}
.say svg{width:1.1rem;height:1.1rem}
.exs{margin-top:.4rem;display:grid;gap:.5rem}
.ex{border-left:3px solid var(--rule);padding-left:.75rem}
.ex .jp{color:var(--jp);font-size:1.12rem;line-height:1.9}
.ex .rm{font-size:.88rem;line-height:1.4}
.ex .en{font-size:.92rem}
.sec-tools{display:flex;gap:1rem;align-items:center;margin:.25rem 0 .9rem;color:var(--muted);font-size:.9rem}
.bar-prog{flex:0 0 8rem;height:6px;background:var(--wash);border-radius:99px;overflow:hidden}
.bar-prog i{display:block;height:100%;background:var(--mean);width:0}

/* grammar */
.g-item{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:1rem 1.2rem;margin:0 0 1rem}
.g-head{display:flex;gap:.5rem 1rem;align-items:baseline;flex-wrap:wrap}
.g-head .kj{font-size:1.7rem}
.g-head .gist{font-weight:500}
.g-form{margin:.35rem 0 0;padding:.4rem .7rem;background:var(--wash);border-radius:8px;font-size:.95rem}
.g-note{margin:.4rem 0 0;font-size:.93rem;color:var(--muted)}
.use{margin-top:.8rem}
.use>.lab{font-weight:500;margin-bottom:.25rem}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:42rem}
th,td{padding:.55rem .75rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule)}
th{font-size:.88rem;color:var(--muted);font-weight:700;background:var(--wash);position:sticky;top:0}
tr:last-child td{border-bottom:0}
.fc{display:flex;flex-direction:column;line-height:1.35}
.fc .kj{font-size:1.1rem;font-weight:500}
.fc .kn{font-size:.85rem}.fc .rm{font-size:.82rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0 .8rem}
.chip{border:1.5px solid var(--rule);background:var(--surface);border-radius:999px;padding:.3rem .8rem;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--kanji);border-color:var(--kanji);color:var(--surface)}

/* kana */
.kgrid{display:grid;grid-template-columns:repeat(5,minmax(3.6rem,1fr));gap:.4rem;max-width:34rem}
.kgrid.y3{grid-template-columns:repeat(3,minmax(3.6rem,1fr));max-width:21rem}
.kc{background:var(--surface);border:1px solid var(--rule);border-radius:8px;text-align:center;padding:.35rem .2rem;line-height:1.25}
.kc b{display:block;font-family:var(--serif);font-size:1.6rem;font-weight:700;color:var(--kana)}
.kc span{font-size:.82rem}
.kc.empty{background:transparent;border-color:transparent}
.kwrap{display:flex;gap:2rem;flex-wrap:wrap}
.kwrap>div{min-width:0}
.kwrap h4{margin:.2rem 0 .4rem;font-size:1rem}
.note-list{margin:.6rem 0 0;padding-left:1.2rem;max-width:46rem}
.note-list li{margin:.3rem 0}

/* counters */
.counter{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:.9rem 1.1rem;margin-bottom:.9rem}
.counter .top{display:flex;gap:.6rem 1.2rem;align-items:baseline;flex-wrap:wrap;margin-bottom:.5rem}
.counter .top .kj{font-size:1.9rem}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.6rem,1fr));gap:.4rem}
.cc{border:1px solid var(--rule);border-radius:8px;padding:.3rem .5rem;line-height:1.3}
.cc small{color:var(--muted);display:block;font-size:.75rem}
.cc .kn{display:block}

/* kanji */
.kgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.75rem}
.kt{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:.8rem 1rem}
.kt .big{font-family:var(--serif);font-size:3rem;font-weight:700;line-height:1;color:var(--kanji)}
.kt .mn{font-weight:500}
.kt .rd{font-size:.92rem;margin-top:.3rem}
.kt .wd{font-size:.92rem;margin-top:.4rem;color:var(--jp)}
.kt .wd small{color:var(--kana)}
.kt .wd .rm{font-size:.8rem}

.tip{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:8px;padding:.7rem 1rem;margin:0 0 .7rem}
.tip b{font-family:var(--serif);font-size:1.05rem}
.tip p{margin:.2rem 0 0;font-size:.95rem}
.none{padding:2rem;text-align:center;color:var(--muted)}

@media (max-width:900px){
  :root{--bar-h:7.2rem}
  .shell{grid-template-columns:1fr}
  .nav{display:none}
  .jump{display:block}
  .hero{grid-template-columns:1fr}
  .stamp{width:5rem;height:5rem;font-size:3.2rem;order:-1}
  .entry{grid-template-columns:1.6rem minmax(0,1fr)}
  .entry .head{grid-column:2}
  .entry .body{grid-column:2}
  main{padding:1rem .9rem 4rem}
  .bar .brand{display:none}
}
@media print{
  .bar,.nav{display:none}.shell{display:block}body{background:#fff}
}

.kj ruby rt{font-family:var(--sans);font-weight:500;font-size:.42em;color:var(--kana)}
.hero h1 ruby rt{font-size:.25em;font-family:var(--sans);color:var(--kana)}
.kj{line-height:1.7}

</style>
</head>
<body>
<header class="bar">
  <span class="brand">日本語 N5</span>
  <div class="search"><input id="q" type="search" placeholder="Search kana, kanji, romaji or English" aria-label="Search"></div>
  <div class="toggles" role="group" aria-label="Display options">
    <button class="tg" type="button" data-tg="rom" aria-pressed="true">Romaji</button>
    <button class="tg" type="button" data-tg="furi" aria-pressed="true">Furigana</button>
    <button class="tg" type="button" data-tg="ex" aria-pressed="true">Examples</button>
    <button class="tg" type="button" data-tg="study" aria-pressed="false">Study mode</button>
  </div>
  <select id="jump" class="jump" aria-label="Jump to section"></select>
  <span class="prog" id="prog" aria-live="polite"></span>
</header>
<div class="shell">
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <main id="main-wrap">
    <div class="hero">
      <div>
        <h1><ruby>日本語<rt>にほんご</rt></ruby> N5</h1>
        <p>Vocabulary, grammar and kanji for JLPT N5 and NAT-TEST 5Q, rebuilt from your notes with the gaps filled in.</p>
        <div class="stats" id="stats"></div>
      </div>
      <div class="stamp" aria-hidden="true">五</div>
    </div>
    <div id="main"></div>
  </main>
</div>
<script>
const VOCAB_1 = String.raw`
# People and pronouns|people
私|わたし|I; me|{私|わたし} [は|wa] {毎日|まいにち} {図書館|としょかん} で {日本語|にほんご} を {勉強|べんきょう} します。|I study Japanese at the library every day.
私たち|わたしたち|we; us|{私|わたし}たち [は|wa] {日曜日|にちようび} に {家族|かぞく} と {公園|こうえん} を {散歩|さんぽ} します。|We take a walk in the park with our family on Sunday.
あなた|あなた|you|あなた [は|wa] {学生|がくせい} です か、 それとも {会社員|かいしゃいん} です か。|Are you a student or a company employee?
あの人|あのひと|that person|あの {人|ひと} [は|wa] {駅|えき} で {友達|ともだち} を {待|ま}って います。|That person is waiting for a friend at the station.
あの方|あのかた|that person (polite)|あの {方|かた} [は|wa] {病院|びょういん} の {医者|いしゃ} です。|That person is a doctor at the hospital.
彼|かれ|he; boyfriend|{彼|かれ} [は|wa] {大学生|だいがくせい} で、 {毎日|まいにち} {電車|でんしゃ} で {大学|だいがく} [へ|e] {行|い}きます。|He is a university student and goes to university by train every day.
彼女|かのじょ|she; girlfriend|{彼女|かのじょ} [は|wa] {花屋|はなや} で {働|はたら}いて います。|She works at a flower shop.
誰|だれ|who|{図書館|としょかん} に いる {男|おとこ} の {人|ひと} [は|wa] {誰|だれ} です か。|Who is the man in the library?
どなた|どなた|who (polite)|あの {病院|びょういん} の {先生|せんせい} [は|wa] どなた です か。|Who is the doctor at that hospital?
人|ひと|person|この {町|まち} に [は|wa] {親切|しんせつ} な {人|ひと} が たくさん います。|There are many kind people in this town.
男の人|おとこのひと|man|あの {男|おとこ} の {人|ひと} [は|wa] {私|わたし} の {兄|あに} です。|That man is my older brother.
女の人|おんなのひと|woman|{駅|えき} に いる {女|おんな} の {人|ひと} [は|wa] {田中|たなか} さん の {奥|おく}さん です。|The woman at the station is Mr. Tanaka's wife.
男の子|おとこのこ|boy|{男|おとこ} の {子|こ} [は|wa] {公園|こうえん} で {犬|いぬ} と {遊|あそ}んで います。|The boy is playing with a dog in the park.
女の子|おんなのこ|girl|{女|おんな} の {子|こ} [は|wa] お{母|かあ}さん と {本屋|ほんや} [へ|e] {行|い}きます。|The girl goes to the bookstore with her mother.
子供|こども|child; children|{子供|こども}たち [は|wa] {学校|がっこう} の {後|あと} で {公園|こうえん} [へ|e] {行|い}きます。|The children go to the park after school.
大人|おとな|adult|{大人|おとな} の {切符|きっぷ} [は|wa] {子供|こども} の {切符|きっぷ} より {高|たか}い です。|An adult ticket is more expensive than a child's ticket.
友達|ともだち|friend|{友達|ともだち} と {映画|えいが} を {見|み}ます。|I watch a movie with a friend.
一緒|いっしょ|together|{明日|あした}、 {妹|いもうと} と {一緒|いっしょ} に {映画館|えいがかん} [へ|e] {行|い}きます。|Tomorrow, I will go to the movie theater with my younger sister.
皆さん|みなさん|everyone|{皆|みな}さん、 {一緒|いっしょ} に {駅|えき} まで {歩|ある}きましょう。|Everyone, let's walk to the station together.
自分|じぶん|oneself; myself|{子供|こども} [は|wa] {自分|じぶん} の {名前|なまえ} を {書|か}きました。|The child wrote their own name.
外国人|がいこくじん|foreign person|その {外国人|がいこくじん} [は|wa] {日本語|にほんご} が よく {分|わ}かります。|That foreign person understands Japanese well.
名前|なまえ|name|お{名前|なまえ} [は|wa] {何|なん} です か。|What is your name?
〜さん|さん|Mr.; Ms. (polite title)|{田中|たなか} さん [は|wa] {親切|しんせつ} です。|Mr. Tanaka is kind.

# Family|family
家族|かぞく|family|{私|わたし} の {家族|かぞく} [は|wa] {五人|ごにん} です。 {兄|あに} と {妹|いもうと} が います。|There are five people in my family. I have an older brother and a younger sister.
両親|りょうしん|parents|{両親|りょうしん} [は|wa] {京都|きょうと} に {住|す}んで います。|My parents live in Kyoto.
父|ちち|my father|{父|ちち} [は|wa] {会社|かいしゃ} で {働|はたら}いて、 {七時|しちじ} に {家|いえ} [へ|e] {帰|かえ}ります。|My father works at a company and returns home at seven.
母|はは|my mother|{母|はは} [は|wa] {八百屋|やおや} で {野菜|やさい} を {買|か}います。|My mother buys vegetables at the greengrocer's.
お父さん|おとうさん|father; someone's father|{田中|たなか} さん の お{父|とう}さん [は|wa] {今|いま} どこ に います か。|Where is Mr. Tanaka's father now?
お母さん|おかあさん|mother; someone's mother|{友達|ともだち} の お{母|かあ}さん [は|wa] {病院|びょういん} [へ|e] {行|い}きました。|My friend's mother went to the hospital.

const k2h = s => s.replace(/[\u30A1-\u30F6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));

function toRomaji(src) {
  if (OVERRIDE[src]) return OVERRIDE[src];
  const s = [...k2h(src)];
  let out = '', gem = false;
  for (let i = 0; i < s.length; i++) {
    const c = s[i], n = s[i + 1];
    if (c === '<') { let j = i + 1, t = ''; while (j < s.length && s[j] !== '>') t += s[j++]; out += t; i = j; continue; }
    if (c === 'っ') { gem = true; continue; }
    if (c === 'ー') { out += 'ー'; continue; }
    if (c === 'ん') { out += (n && /[あいうえおやゆよ]/.test(n)) ? "n'" : 'n'; continue; }
    if (PUNCT[c] !== undefined) { out += PUNCT[c]; continue; }
    let r;
    if (YSTEM[c] && n && SY[n]) { r = YSTEM[c] + SY[n]; i++; }
    else if (BASE[c] && n && SV[n] && !SV[c]) {
      r = c === 'う' ? 'w' + SV[n] : BASE[c].slice(0, -1) + SV[n]; i++;
    }
    else r = BASE[c] !== undefined ? BASE[c] : c;
    if (gem && /^[a-z]/.test(r)) r = (r.startsWith('ch') ? 't' : r[0]) + r;
    gem = false;
    out += r;
  }
  out = out.replace(/([aiueo])ー/g, (m, v) => MAC[v]).replace(/ー/g, '');
  out = out.replace(/ou/g, 'ō').replace(/oo/g, 'ō').replace(/uu/g, 'ū').replace(/aa/g, 'ā').replace(/ee/g, 'ē');
  return out;
}
function polish(r) {
  r = r.replace(/\s+/g, ' ').replace(/ san\b/g, '-san').replace(/\s+([.,?!”])/g, '$1').replace(/([,.?!])(?=[^\s”])/g, '$1 ').replace(/“\s+/g, '“').trim();
  r = r.split(' ').map(w => {
    const core = w.replace(/^“/, '').replace(/[.,?!”]+$/, '');
    const base = core.split('-')[0];
    return NAMES.has(base) ? w.replace(base, base[0].toUpperCase() + base.slice(1)) : w;
  }).join(' ');
  r = r.replace(/^(“?)([a-zāīūēō])/, (m, q, c) => q + c.toUpperCase());
  return r.replace(/([.?!] )([a-zāīūēō])/g, (m, a, b) => a + b.toUpperCase());
}

/* ---------- sentence markup: {漢字|かな} [は|wa] plain ---------- */
function parseSentence(src) {
  const re = /\{([^|}]+)\|([^}]+)\}|\[([^|\]]+)\|([^\]]+)\]|(\s+)|([^\s{\[]+)/g;
  let m, html = '', text = '', kana = '';
  while ((m = re.exec(src))) {
    if (m[1]) { html += '<ruby>' + esc(m[1]) + '<rt>' + esc(m[2]) + '</rt></ruby>'; text += m[1]; kana += m[2]; }
    else if (m[3]) { html += esc(m[3]); text += m[3]; kana += '<' + m[4] + '>'; }
    else if (m[5]) { kana += ' '; }
    else { html += esc(m[6]); text += m[6]; kana += m[6]; }
  }
  return { html, text, rom: polish(toRomaji(kana)) };
}

/* ---------- field splitter that ignores | inside { } and [ ] ---------- */
function splitFields(line) {
  const out = []; let cur = '', d = 0;
  for (const ch of line) {
    if (ch === '{' || ch === '[') d++;
    if (ch === '}' || ch === ']') d--;
    if (ch === '|' && d === 0) { out.push(cur); cur = ''; } else cur += ch;
  }
  out.push(cur);
  return out;
}

/* ---------- conjugation ---------- */
const I_ROW = {う:'い',く:'き',ぐ:'ぎ',す:'し',つ:'ち',ぬ:'に',ぶ:'び',む:'み',る:'り'};
const A_ROW = {う:'わ',く:'か',ぐ:'が',す:'さ',つ:'た',ぬ:'な',ぶ:'ば',む:'ま',る:'ら'};
function conjOne(s, g, kana, word) {
  if (g === 'v3') {
    if (s.endsWith('する')) { const st = s.slice(0, -2); return { dict: s, masu: st + 'します', te: st + 'して', nai: st + 'しない', ta: st + 'した' }; }
    const st = s.slice(0, -(s.endsWith('来る') ? 2 : 2));
    if (kana) return { dict: s, masu: st + 'きます', te: st + 'きて', nai: st + 'こない', ta: st + 'きた' };
    return { dict: s, masu: st + '来ます', te: st + '来て', nai: st + '来ない', ta: st + '来た' };
  }
  if (g === 'v2') { const st = s.slice(0, -1); return { dict: s, masu: st + 'ます', te: st + 'て', nai: st + 'ない', ta: st + 'た' }; }
  const last = s.slice(-1), st = s.slice(0, -1);
  let te, ta;
  if (word === '行く') { te = st + 'って'; ta = st + 'った'; }
  else if ('うつる'.includes(last)) { te = st + 'って'; ta = st + 'った'; }
  else if ('むぬぶ'.includes(last)) { te = st + 'んで'; ta = st + 'んだ'; }
  else if (last === 'く') { te = st + 'いて'; ta = st + 'いた'; }
  else if (last === 'ぐ') { te = st + 'いで'; ta = st + 'いだ'; }
  else { te = st + 'して'; ta = st + 'した'; }
  return { dict: s, masu: st + I_ROW[last] + 'ます', te, ta, nai: word === 'ある' ? 'ない' : st + A_ROW[last] + 'ない' };
}
const conjVerb = (w, r, g) => ({ kj: conjOne(w, g, false, w), kn: conjOne(r, g, true, w) });

function conjAdj(w, r, t) {
  const f = s => {
    if (t === 'na') return { pres: s + 'です', neg: s + 'ではありません', past: s + 'でした', pneg: s + 'ではありませんでした', te: s + 'で', adv: s + 'に' };
    const stem = s === 'いい' ? 'よ' : s.slice(0, -1);
    return { pres: s + 'です', neg: stem + 'くないです', past: stem + 'かったです', pneg: stem + 'くなかったです', te: stem + 'くて', adv: stem + 'く' };
  };
  return { kj: f(w), kn: f(r) };
}

/* ---------- parse vocabulary ---------- */
function parseVocab(raw) {
  const cats = []; let cur = null;
  raw.split('\n').forEach(line => {
    line = line.trim(); if (!line) return;
    if (line.startsWith('# ')) { const p = line.slice(2).split('|'); cur = { id: p[1], title: p[0], entries: [] }; cats.push(cur); return; }
    const f = splitFields(line);
    let tag = '';
    if (/^(v1|v2|v3|i|na)$/.test(f[f.length - 1])) tag = f.pop();
    const word = f[0], reading = f[1], meaning = f[2], ex = f[3] || '', en = f[4] || '';
    const exs = ex ? ex.split(';;').map(s => s.trim()) : [];
    const ens = en ? en.split(';;').map(s => s.trim()) : [];
    const e = { word, reading, meaning, tag, key: word + '|' + reading, rom: toRomaji(reading),
      exs: exs.map((x, i) => Object.assign(parseSentence(x), { en: ens[i] || '' })) };
    if (tag[0] === 'v') e.conj = conjVerb(word, reading, tag);
    cur.entries.push(e);
  });
  return cats;
}
const CATS = parseVocab(VOCAB_1).concat(parseVocab(VOCAB_2), parseVocab(VOCAB_3), parseVocab(VOCAB_4));

/* ---------- speech ---------- */
function speak(t) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; u.rate = 0.85;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('ja'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
const SAY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const sayBtn = t => '<button class="say" type="button" data-say="' + esc(t) + '" aria-label="Play pronunciation" title="Play pronunciation">' + SAY + '</button>';

const SUF = [['ではありませんでした',' dewa arimasen deshita'],['ではありません',' dewa arimasen'],['でした',' deshita'],['です',' desu']];
function romSp(k) { for (const [a, b] of SUF) if (k.endsWith(a) && k.length > a.length) return toRomaji(k.slice(0, -a.length)) + b; return toRomaji(k); }
const fc = (kj, kn, sp) => '<div class="fc"><span class="kj">' + esc(kj) + '</span>' + (kn !== kj ? '<span class="kn">' + esc(kn) + '</span>' : '') + '<span class="rm">' + esc(sp ? romSp(kn) : toRomaji(kn)) + '</span></div>';

function romReads(str) {

}

function kanaSection() {

      '<div><h4>Voiced sounds (゛ ゜)</h4><div class="kgrid">' + daku + '</div></div>' +

  };
  return '<section class="sec" id="k-kana" data-sec><h2>Writing system</h2>' +
    '<p class="lede">Japanese mixes three scripts. Hiragana writes native words and grammar. Katakana writes loanwords and emphasis. Kanji carry meaning.</p>' +
    '<div class="chips" role="group" aria-label="Choose script"><button class="chip" type="button" data-sc="h" aria-pressed="true">Hiragana</button><button class="chip" type="button" data-sc="k" aria-pressed="false">Katakana</button></div>' +
    '<div id="kana-h">' + build(x => x) + '</div><div id="kana-k" hidden>' + build(kata) + '</div>' +
    '<ul class="note-list"><li>Small っ doubles the next consonant: きっぷ is kippu.</li><li>ん is its own syllable: ほんや is hon’ya.</li><li>Long vowels last twice as long and change meaning: おばさん (aunt) and おばあさん (grandmother). In katakana, ー lengthens the vowel: コーヒー.</li><li>As particles, は is read wa, へ is read e and を is read o.</li><li>Romaji on this page uses macrons (ā ī ū ē ō) for long vowels.</li></ul></section>';
}

function overview() {
  return '<section class="sec" id="overview" data-sec><h2>Overview</h2>' +
    '<p class="lede">Everything is organised the way the exam asks: words, grammar, then kanji. Use the buttons in the top bar to hide romaji or furigana, hide examples, or switch on study mode, which blurs meanings until you click them. Tick the box beside a word when you know it; progress is saved in this browser.</p>' +
    '<div class="legend" aria-label="Colour key"><span class="c-kanji">Kanji or target expression</span><span class="c-kana">Hiragana or katakana reading</span><span class="c-jp">Japanese example</span><span class="c-rom">Romaji</span><span class="c-mean">Meaning and English translation</span></div>' +
    '<div class="facts"><div class="fact"><h4>JLPT N5 format</h4><p>Multiple choice only, with no speaking or writing. Three timed parts: vocabulary, grammar and reading, then listening. Total time is roughly 90 to 105 minutes depending on the test year.</p></div>' +
    '<div class="fact"><h4>Passing marks</h4><p>Scored out of 180. You need 80 overall, at least 38 out of 120 in language knowledge and reading, and at least 19 out of 60 in listening.</p></div>' +
    '<div class="fact"><h4>Word lists</h4><p>The JLPT has published no official vocabulary or kanji list since 2010. This page follows the widely used N5 scope plus textbook-level extras, so treat it as a study guide, not an official syllabus.</p></div>' +
    '<div class="fact"><h4>NAT-TEST 5Q</h4><p>Aimed at the same beginner level, so the same material applies. Check the official NAT-TEST site for its current format, dates and fees.</p></div></div>' +
    '<p class="g-note">Exam figures come from public summaries of the official JLPT guide. Confirm them on jlpt.jp before you book.</p>' +
    '<details class="chg"><summary>What changed from your original notes</summary><ul>' +
    '<li>Kept every particle, vocabulary entry and example from your page, then added the missing material: numbers, counters, time, days, months, food, objects, body, weather, position, transport, more verbs and adjectives, adverbs, question words, set phrases, kana and kanji.</li>' +
    '<li>Removed duplicates: 買います, 学生, 図書館, 駅 and 学校 appeared twice, so their examples are now merged under one entry.</li>' +
    '<li>Removed repeated example lines (小さいけれども, 日曜日は掃除したり, きれいだなあ) that appeared with two romanizations.</li>' +
    '<li>Completed the truncated へ entry, fixed the stray “(S0046)” code, and split 早い and 速い, which are different words.</li>' +
    '<li>Made romaji consistent: macrons for long vowels, “ii” kept as in Hepburn (oniisan, ojiisan), and hon’ya, pan’ya with the apostrophe after ん.</li>' +
    '<li>Verbs are listed in dictionary form with the ます form beside them, because conjugation patterns need the dictionary form.</li>' +
    '<li>Words that appeared only inside examples (新聞, 手紙, 切符, 野菜, 果物, 自転車, 親切) now have their own entries.</li></ul></details>' +
    '<button class="btn" type="button" id="reset">Reset learned progress</button></section>';
}

function tipsSection() {
  return '<section class="sec" id="tips" data-sec><h2>Common traps</h2><p class="lede">Mistakes that cost points on the exam.</p>' +
    TIPS.map(t => '<div class="tip" data-s="' + searchAttr(t[0], t[1]) + '"><b>' + esc(t[0]) + '</b><p>' + esc(t[1]) + '</p></div>').join('') + '</section>';
}

/* ---------- furigana for free text ---------- */
const KJ = /[\u4e00-\u9fff]/;
const DICT = {};
CATS.forEach(c => c.entries.forEach(e => {
  if (KJ.test(e.word)) DICT[e.word] = e.reading;
  if (e.conj) ['masu', 'te', 'nai', 'ta'].forEach(f => { if (KJ.test(e.conj.kj[f])) DICT[e.conj.kj[f]] = e.conj.kn[f]; });
  if (e.tag === 'i' || e.tag === 'na') { const a = conjAdj(e.word, e.reading, e.tag); Object.keys(a.kj).forEach(k => { const w = a.kj[k].replace(/(ではありませんでした|ではありません|でした|です)$/, ''); const r = a.kn[k].replace(/(ではありませんでした|ではありません|でした|です)$/, ''); if (KJ.test(w) && w !== r) DICT[w] = r; }); }
}));
[KANJI_CORE, KANJI_EXTRA].forEach(raw => raw.trim().split('\n').forEach(l => l.split('|')[4].split(',').forEach(w => { const p = w.split(':'); if (KJ.test(p[0])) DICT[p[0]] = p[1]; })));
Object.assign(DICT, { '三時':'さんじ', '三時間':'さんじかん', '一緒':'いっしょ', '日本語':'にほんご', '行って':'いって', '思います':'おもいます', '思う':'おもう', '食べる':'たべる', '食べます':'たべます', '食べない':'たべない', '食べた':'たべた', '食べません':'たべません', '食べました':'たべました', '食べませんでした':'たべませんでした', '食べなかった':'たべなかった', '行く':'いく', '行きます':'いきます', '来ます':'きます', '行った':'いった', '好き':'すき', '嫌い':'きらい', '上手':'じょうず', '来る':'くる', '勉強':'べんきょう', '漢字':'かんじ', '図書館':'としょかん', '日本':'にほん', '三百':'さんびゃく', '六百':'ろっぴゃく', '八百':'はっぴゃく', '三千':'さんぜん', '八千':'はっせん', '一本':'いっぽん', '二本':'にほん', '三本':'さんぼん', '四時':'よじ', '七時':'しちじ', '九時':'くじ', '四月':'しがつ', '七月':'しちがつ', '九月':'くがつ', '一人':'ひとり', '二人':'ふたり', '四円':'よえん', '五分':'ごふん', '買い物':'かいもの', '十日':'とおか' });
const DKEYS = Object.keys(DICT).sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
const DRE = new RegExp(DKEYS.join('|'), 'g');
function furi(t) {
  let out = '', last = 0;
  t.replace(DRE, (m, off) => { out += esc(t.slice(last, off)) + '<ruby>' + esc(m) + '<rt>' + esc(DICT[m]) + '</rt></ruby>'; last = off + m.length; return m; });
  return out + esc(t.slice(last));
}
const SKIP = 'ruby,.entry .head,.fc,.kt,.jp,.rm,.kn,button,option,select,script,style,.kc';
function annotate(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while (w.nextNode()) { const n = w.currentNode; if (KJ.test(n.nodeValue) && !(n.parentElement && n.parentElement.closest(SKIP))) nodes.push(n); }
  nodes.forEach(n => {
    const h = furi(n.nodeValue);
    if (h.indexOf('<ruby>') < 0) return;
    const t = document.createElement('template'); t.innerHTML = h; n.replaceWith(t.content);
  });
}
const CRD = { '人':'にん','個':'こ','枚':'まい','本':'ほん','冊':'さつ','台':'だい','匹':'ひき','杯':'はい','回':'かい','階':'かい','歳':'さい','円':'えん','時間':'じかん','週間':'しゅうかん','か月':'かげつ','年':'ねん','番':'ばん' };

/* ---------- assemble ---------- */
const sections = [];
function add(group, id, label, html, count) { sections.push({ group, id, label, html, count }); }

add('Start', 'overview', 'Overview', overview());
add('Start', 'k-kana', 'Writing system', kanaSection());
CATS.forEach(c => add('Vocabulary', 'v-' + c.id, c.title, vocabSection(c), c.entries.length));
GRAMMAR.slice(0, 2).forEach(g => add('Grammar', 'g-' + g.id, g.title, grammarSection(g), g.items.length));
add('Grammar', 'g-demo', 'Demonstratives', demoSection());
GRAMMAR.slice(2).forEach(g => add('Grammar', 'g-' + g.id, g.title, grammarSection(g), g.items.length));
add('Tables', 't-verbs', 'Verb conjugation lab', verbLab());
add('Tables', 't-adj', 'Adjective conjugation lab', adjLab());
add('Tables', 't-counters', 'Counters', counterSection(), COUNTERS.length);
add('Kanji and tips', 'kanji-core', 'Core N5 kanji', kanjiSection(KANJI_CORE, 'kanji-core', 'Core N5 kanji', 'The kanji most N5 study lists share. On readings (音) are in katakana; kun readings (訓) are in hiragana, with okurigana in brackets.'), KANJI_CORE.trim().split('\n').length);
add('Kanji and tips', 'kanji-extra', 'Kanji seen in this vocabulary', kanjiSection(KANJI_EXTRA, 'kanji-extra', 'Kanji seen in this vocabulary', 'Extra kanji that appear in the word lists above. Useful for reading, though the exam usually shows them with furigana at this level.'), KANJI_EXTRA.trim().split('\n').length);
add('Kanji and tips', 'tips', 'Common traps', tipsSection());

const main = document.getElementById('main');
main.innerHTML = sections.map(s => s.html).join('');
annotate(main);

/* nav */
const nav = document.getElementById('nav'), jump = document.getElementById('jump');
let navHtml = '', jumpHtml = '<option value="">Jump to section</option>', lastG = '';
sections.forEach(s => {
  if (s.group !== lastG) { navHtml += '<h4>' + s.group + '</h4>'; if (lastG) jumpHtml += '</optgroup>'; jumpHtml += '<optgroup label="' + s.group + '">'; lastG = s.group; }
  navHtml += '<a href="#' + s.id + '" data-nav="' + s.id + '"><span>' + esc(s.label) + '</span>' + (s.count ? '<small>' + s.count + '</small>' : '') + '</a>';
  jumpHtml += '<option value="' + s.id + '">' + esc(s.label) + '</option>';
});
nav.innerHTML = navHtml; jump.innerHTML = jumpHtml + '</optgroup>';
jump.addEventListener('change', () => { if (jump.value) { document.getElementById(jump.value).scrollIntoView(); jump.value = ''; } });

/* hero stats */
const uniq = new Set(); CATS.forEach(c => c.entries.forEach(e => uniq.add(e.key)));
const gCount = GRAMMAR.reduce((a, g) => a + g.items.length, 0);
document.getElementById('stats').innerHTML =
  '<div><b>' + uniq.size + '</b><span>vocabulary entries</span></div><div><b>' + gCount + '</b><span>grammar points</span></div>' +
  '<div><b>' + (KANJI_CORE.trim().split('\n').length + KANJI_EXTRA.trim().split('\n').length) + '</b><span>kanji</span></div><div><b>' + COUNTERS.length + '</b><span>counters</span></div>';

/* ---------- state: toggles ---------- */
const body = document.body;
const prefs = Object.assign({ rom: true, furi: true, ex: true, study: false }, store.get('n5.prefs', {}));
function applyPrefs() {
  body.classList.toggle('no-rom', !prefs.rom); body.classList.toggle('no-furi', !prefs.furi);
  body.classList.toggle('no-ex', !prefs.ex); body.classList.toggle('study', prefs.study);
  document.querySelectorAll('[data-tg]').forEach(b => b.setAttribute('aria-pressed', String(prefs[b.dataset.tg])));
}
document.querySelectorAll('[data-tg]').forEach(b => b.addEventListener('click', () => {
  prefs[b.dataset.tg] = !prefs[b.dataset.tg]; store.set('n5.prefs', prefs); applyPrefs();
}));
applyPrefs();

/* ---------- progress ---------- */
function updateProgress() {
  let done = 0, total = 0;
  CATS.forEach(c => {
    const d = c.entries.filter(e => learned.has(e.key)).length;
    done += d; total += c.entries.length;
    const bar = document.querySelector('[data-bar="' + c.id + '"]'), lab = document.querySelector('[data-done="' + c.id + '"]');
    if (bar) bar.style.width = (100 * d / c.entries.length) + '%';
    if (lab) lab.textContent = d + ' of ' + c.entries.length + ' learned';
  });
  document.getElementById('prog').textContent = done + ' / ' + total + ' learned';
}
updateProgress();

/* ---------- events (delegated) ---------- */
document.addEventListener('click', ev => {
  const t = ev.target;
  const say = t.closest('[data-say]'); if (say) { speak(say.dataset.say); return; }
  const m = t.closest('.m'); if (m && body.classList.contains('study')) m.classList.toggle('show');
  const vg = t.closest('[data-vg]');
  if (vg) {
    document.querySelectorAll('[data-vg]').forEach(b => b.setAttribute('aria-pressed', String(b === vg)));
    document.querySelectorAll('#verb-rows tr').forEach(r => { r.dataset.gf = (vg.dataset.vg === 'all' || r.dataset.g === vg.dataset.vg) ? '' : '1'; });
    runSearch();
  }
  const sc = t.closest('[data-sc]');
  if (sc) {
    document.querySelectorAll('[data-sc]').forEach(b => b.setAttribute('aria-pressed', String(b === sc)));
    document.getElementById('kana-h').hidden = sc.dataset.sc !== 'h'; document.getElementById('kana-k').hidden = sc.dataset.sc !== 'k';
  }
  if (t.id === 'reset') { if (confirm('Clear all learned marks?')) { learned.clear(); store.set('n5.learned', []); document.querySelectorAll('.entry').forEach(e => { e.classList.remove('done'); e.querySelector('input').checked = false; }); updateProgress(); } }
});
document.addEventListener('change', ev => {
  const li = ev.target.closest('.entry'); if (!li || ev.target.type !== 'checkbox') return;
  const k = li.dataset.key;
  if (ev.target.checked) learned.add(k); else learned.delete(k);
  li.classList.toggle('done', ev.target.checked);
  store.set('n5.learned', [...learned]); updateProgress();
});

/* ---------- search ---------- */
const q = document.getElementById('q');
function runSearch() {
  const term = plain(q.value.trim());
  document.querySelectorAll('[data-s]').forEach(el => {
    const hit = !term || el.dataset.s.includes(term);
    el.hidden = !hit || el.dataset.gf === '1';
  });
  let any = false;
  document.querySelectorAll('[data-sec]').forEach(sec => {
    if (sec.id === 'overview' || sec.id === 'k-kana') { sec.hidden = !!term; return; }
    const items = sec.querySelectorAll('[data-s]');
    const vis = [...items].filter(i => !i.hidden).length;
    sec.hidden = !!term && vis === 0;
    if (!sec.hidden) any = true;
  });
  document.querySelectorAll('[data-nav]').forEach(a => { const s = document.getElementById(a.dataset.nav); a.hidden = !!(s && s.hidden); });
  let none = document.getElementById('none');
  if (term && !any) { if (!none) { none = document.createElement('div'); none.id = 'none'; none.className = 'none'; main.appendChild(none); } none.textContent = 'No matches for “' + q.value.trim() + '”. Try a kana, kanji, romaji or English word.'; none.hidden = false; }
  else if (none) none.hidden = true;
}
let st; q.addEventListener('input', () => { clearTimeout(st); st = setTimeout(runSearch, 120); });

/* ---------- active nav ---------- */
if ('IntersectionObserver' in window) {
  const links = {}; nav.querySelectorAll('a').forEach(a => links[a.dataset.nav] = a);
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { Object.values(links).forEach(a => a.classList.remove('on')); if (links[e.target.id]) links[e.target.id].classList.add('on'); }
  }), { rootMargin: '-15% 0px -75% 0px' });
  document.querySelectorAll('[data-sec]').forEach(s => io.observe(s));
}
})();

</script>
</body>
</html>
