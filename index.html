<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Uday's Studio</title>
    <link rel="icon" type="image/svg+xml" href="pen_book_logo.svg">
    <script>
        // Theme toggle - applied before first paint to avoid flash
        if (localStorage.getItem('theme') === 'dark' ||
            (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js"></script>
    <style>
        :root { color-scheme: light; }
        :root.dark { color-scheme: dark; }

        /* Login Page Styles */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
        }
        :root.dark .auth-container {
            background-color: #0f172a;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background-color: white;
            border-radius: 1rem;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
            overflow: hidden;
        }
        :root.dark .auth-card {
            background-color: #1e293b;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        }

        .auth-header {
            background-color: #0f172a;
            color: white;
            padding: 1.25rem 1.5rem;
        }

        .auth-body {
            padding: 1.5rem;
        }

        .error-message {
            margin-top: 1rem;
            padding: 0.75rem;
            background-color: #fee2e2;
            color: #b91c1c;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            display: none;
        }

        .page-toggle {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            justify-content: center;
        }

        .page-toggle-btn {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.375rem;
            background: white;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            color: #64748b;
        }

        .page-toggle-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .page-toggle-btn:hover:not(.active) {
            background: #f1f5f9;
        }

        :root.dark .page-toggle-btn {
            background: #1e293b;
            color: #94a3b8;
            border-color: #334155;
        }

        :root.dark .page-toggle-btn.active {
            background: #2563eb;
        }

        :root.dark .page-toggle-btn:hover:not(.active) {
            background: #334155;
        }

        .page-content {
            display: none;
        }

        .page-content.active {
            display: block;
        }

        .input-field {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            outline: none;
            transition: all 0.2s;
        }

        .input-field:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        :root.dark .input-field {
            background: #0f172a;
            color: #e2e8f0;
            border-color: #334155;
        }

        :root.dark .input-field:focus {
            border-color: #2563eb;
        }

        .btn {
            width: 100%;
            padding: 0.625rem;
            border: none;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: white;
            color: #64748b;
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #f1f5f9;
        }

        :root.dark .btn-secondary {
            background: #0f172a;
            color: #e2e8f0;
            border-color: #334155;
        }

        :root.dark .btn-secondary:hover {
            background: #334155;
        }

        .hint {
            font-size: 0.875rem;
            color: #64748b;
            text-align: center;
            margin-top: 1rem;
        }

        :root.dark .hint {
            color: #94a3b8;
        }

        /* Tech Log Page Content */
        .tech-log-content {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fbff 0%, #eef4ff 100%);
            padding: 1rem;
        }

        :root.dark .tech-log-content {
            background: linear-gradient(135deg, #0f172a 0%, #111c33 100%);
        }

        /* Language Studio Page Content */
        .language-studio-content {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fbff 0%, #eef4ff 100%);
        }

        :root.dark .language-studio-content {
            background: linear-gradient(135deg, #0f172a 0%, #111c33 100%);
        }

        /* Style for application.html content */
        #tech-log-container {
            display: none;
        }

        #tech-log-container.active {
            display: block;
        }

        /* Style for language-studio.html content */
        #language-studio-container {
            display: none;
        }

        #language-studio-container.active {
            display: block;
        }
    </style>
</head>
<body class="dark:bg-slate-900">
    <!-- Login Page -->
    <div id="login-page" class="page-content active">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1 class="text-xl font-bold">Uday's Studio</h1>
                    <p class="text-sm text-slate-300 mt-1">Sign in to continue</p>
                </div>
                <div class="auth-body">
                    <div class="page-toggle">
                        <button class="page-toggle-btn active" data-page="tech-log">Tech Log</button>
                        <button class="page-toggle-btn" data-page="language-studio">Language Studio</button>
                    </div>

                    <!-- Tech Log Login Form -->
                    <div id="tech-log-login" class="login-form">
                        <div class="error-message" id="tech-log-error"></div>
                        
                        <div class="space-y-3">
                            <div>
                                <label for="tech-access-code" class="sr-only">Access Code</label>
                                <input type="password" id="tech-access-code" placeholder="Enter Access Code" class="input-field">
                            </div>
                            <button type="submit" class="btn btn-primary" id="tech-log-signin">Sign in</button>
                        </div>

                        <p class="hint">Enter the access code to continue</p>
                    </div>

                    <!-- Language Studio Login Form -->
                    <div id="language-studio-login" class="login-form hidden">
                        <div class="error-message" id="language-studio-error"></div>
                        
                        <div class="space-y-3">
                            <div>
                                <label for="lang-access-code" class="sr-only">Access Code</label>
                                <input type="password" id="lang-access-code" placeholder="Enter Access Code" class="input-field">
                            </div>
                            <button type="submit" class="btn btn-primary" id="language-studio-signin">Sign in</button>
                        </div>

                        <p class="hint">Enter the access code to continue</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Application Container (placeholder for actual app content) -->
    <div id="app-container"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            setPersistence,
            browserLocalPersistence
        } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';
        import {
            getFirestore,
            doc,
            setDoc,
            serverTimestamp
        } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js';
        import {
            getDatabase,
            ref,
            get,
            set
        } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js';
        import { firebaseConfig } from './firebase-config.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const firestoreDb = getFirestore(app);
        const realtimeDb = getDatabase(app);

        let currentPage = 'tech-log';
        let isAuthenticating = false;

        // Page toggle functionality
        document.querySelectorAll('.page-toggle-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (isAuthenticating) return;
                
                document.querySelectorAll('.page-toggle-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.login-form').forEach(f => f.classList.add('hidden'));
                
                e.target.classList.add('active');
                const page = e.target.dataset.page;
                currentPage = page;
                
                document.getElementById(`${page}-login`).classList.remove('hidden');
                document.getElementById(`${page}-error`).style.display = 'none';
            });
        });

        // Tech Log Authentication
        document.getElementById('tech-log-signin').addEventListener('click', async () => {
            const code = document.getElementById('tech-access-code').value.trim();
            const errorEl = document.getElementById('tech-log-error');
            
            if (!code) {
                errorEl.textContent = 'Please enter an access code.';
                errorEl.style.display = 'block';
                return;
            }

            isAuthenticating = true;
            try {
                const email = `${code.toLowerCase()}@udaykajananotes.firebaseapp.com`;
                const password = `${code}-code`;
                await signInWithEmailAndPassword(auth, email, password);
                localStorage.setItem('currentApp', 'tech-log');
            } catch (error) {
                console.error('Tech Log auth error:', error);
                errorEl.textContent = 'Invalid access code. Please try again.';
                errorEl.style.display = 'block';
                isAuthenticating = false;
            }
        });

        // Language Studio Authentication
        document.getElementById('language-studio-signin').addEventListener('click', async () => {
            const code = document.getElementById('lang-access-code').value.trim();
            const errorEl = document.getElementById('language-studio-error');
            
            if (!code) {
                errorEl.textContent = 'Please enter an access code.';
                errorEl.style.display = 'block';
                return;
            }

            isAuthenticating = true;
            try {
                const email = `${code.toLowerCase()}@kajanaudaynotes.local`;
                const password = `${code}-code`;
                await signInWithEmailAndPassword(auth, email, password);
                localStorage.setItem('currentApp', 'language-studio');
            } catch (error) {
                console.error('Language Studio auth error:', error);
                errorEl.textContent = 'Invalid access code. Please try again.';
                errorEl.style.display = 'block';
                isAuthenticating = false;
            }
        });

        // Handle authentication state
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userRole = localStorage.getItem('userRole') || 'reader';
                const currentApp = localStorage.getItem('currentApp') || 'tech-log';
                
                await logUserLogin(user, userRole);
                
                if (currentApp === 'tech-log') {
                    window.location.href = 'application.html';
                } else {
                    window.location.href = 'language-studio.html';
                }
            }
        });

        async function logUserLogin(user, userRole) {
            try {
                const userLogRef = doc(firestoreDb, "user_logs", user.uid);
                await setDoc(userLogRef, {
                    email: user.email,
                    displayName: user.displayName || '',
                    lastLogin: serverTimestamp(),
                    isAdmin: false
                }, { merge: true });
                
                const loginLogRef = doc(firestoreDb, "login_logs", `${user.uid}_${Date.now()}`);
                await setDoc(loginLogRef, {
                    userId: user.uid,
                    email: user.email,
                    timestamp: serverTimestamp(),
                    userAgent: navigator.userAgent,
                    isAdmin: false
                });
            } catch (error) {
                console.error("Error logging user login:", error);
            }
        }

        setPersistence(auth, browserLocalPersistence);

        // Theme toggle
        const themeToggle = document.createElement('button');
        themeToggle.id = 'theme-toggle';
        themeToggle.className = 'fixed top-4 right-4 z-50 p-2 rounded-lg border border-slate-200 bg-white dark:bg-slate-800 dark:border-slate-700';
        themeToggle.innerHTML = `
            <svg id="theme-icon-sun" class="hidden dark:block h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </svg>
            <svg id="theme-icon-moon" class="h-5 w-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        `;
        
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        });
        
        document.body.appendChild(themeToggle);
    </script>
</body>
</html>
