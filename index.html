<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Knowledge Manager</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .json-children {
            margin-left: 10px;
            border-left: 1px dashed #94a3b8;
            display: none;
            padding-left: 8px;
        }

        .json-children.expanded {
            display: block;
        }

        .json-key {
            position: relative;
            padding: 3px 6px 3px 20px;
            margin: 1px 0;
            cursor: pointer;
            font-size: 0.75rem;
            border-radius: 3px;
            transition: all 0.15s ease;
        }

        .json-key:hover {
            background-color: #f1f5f9;
            color: #0ea5e9;
        }
        .json-key.active {
            background-color: #bae6fd;
        }

        .expandable {
            position: relative;
        }

        .expandable::before {
            content: '▸';
            position: absolute;
            left: 6px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 9px;
            color: #64748b;
            transition: transform 0.15s;
        }

        .expandable.expanded::before {
            transform: translateY(-50%) rotate(90deg);
        }

        .note-item {
            padding: 6px 12px;
            margin: 3px 0;
            background: #f8fafc;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid #e2e8f0;
        }

        .note-item:hover {
            background: #f0f9ff;
            border-color: #bae6fd;
        }

        .code-tab {
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
            font-size: 0.65rem;
            font-weight: 500;
            color: #94a3b8;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .code-tab:hover {
            background: #334155;
            color: #e2e8f0;
        }

        .code-tab.active {
            background: #0284c7;
            color: white;
        }

        .code-block {
            margin: 0;
            padding: 0.5rem;
            background: #0f172a;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        .code-block code {
            font-family: 'Fira Code', monospace;
            font-size: 0.65rem;
            line-height: 1.3;
            color: #e2e8f0;
        }

        .search-input {
            transition: all 0.2s ease;
        }

        .search-input:focus {
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        #left-panel-collapsed-indicator {
            position: absolute;
            top: 50%;
            right: -0.5rem;
            width: 0.5rem;
            height: 0.5rem;
            background-color: #cbd5e1;
            border-radius: 50%;
            display: none;
            transform: translateY(-50%);
        }

        #left-panel.collapsed + #left-panel-collapsed-indicator {
            display: block;
        }

        /* Styles for the Modal Editor */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            width: 80%;
            max-width: 800px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .editor-toolbar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .editor-toolbar button {
            padding: 0.25rem 0.5rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.25rem;
            background-color: #f9fafb;
            cursor: pointer;
        }

        .editor-textarea {
            width: 100%;
            height: 200px;
            padding: 0.5rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.25rem;
            resize: vertical;
            font-family: monospace;
        }

        .parent-selector {
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div class="h-screen flex flex-col">
        <!-- Top Ribbon -->
        <div class="h-10 bg-slate-900 flex items-center px-2 gap-2 border-b border-slate-800">
            <!-- Panel Toggle -->
            <button id="panel-toggle" class="h-7 w-7 flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-700 rounded transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>

            <!-- View Toggle -->
            <div class="relative inline-flex items-center cursor-pointer gap-2">
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="view-toggle" class="sr-only peer">
                    <div class="w-9 h-5 bg-slate-700 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-slate-200 after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-500"></div>
                </label>
            </div>

            <!-- Search -->
            <div class="flex-1 max-w-md relative">
                <svg class="absolute left-2 top-1/2 transform -translate-y-1/2 text-slate-400" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" placeholder="Search..." class="h-7 pl-8 w-full bg-slate-800 border-slate-700 text-slate-200 rounded text-sm focus:ring-1 focus:ring-blue-400 focus:border-transparent search-input">
            </div>

            <!-- Add Button (Dynamic) -->
            <button id="add-button" class="h-7 px-2 flex items-center gap-1 bg-blue-600 hover:bg-blue-500 text-white rounded text-sm font-medium transition-colors">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span id="add-button-text">Add Node</span>
            </button>
        </div>

        <!-- Main Container -->
        <div class="flex-1 flex">
            <!-- Left Panel -->
            <div id="left-panel" class="w-0 sm:w-72 border-r border-slate-200 bg-white transition-all duration-300 shadow-sm overflow-hidden">
                <div class="p-3 overflow-y-auto h-full">
                    <div id="json-tree" class="space-y-1">
                        <!-- Tree nodes will be inserted here -->
                    </div>
                </div>
            </div>
            <div id="left-panel-collapsed-indicator"></div>

            <!-- Right Panel -->
            <div class="flex-1 p-2 sm:p-4 overflow-y-auto bg-slate-50">
                <div id="content-panel" class="max-w-4xl mx-auto space-y-3">
                    <div id="description-section"></div>
                    <div id="code-section"></div>
                    <div id="children-section"></div>
                </div>
            </div>
        </div>

        <!-- Modal Editor -->
        <div id="editor-modal" class="modal">
            <div class="modal-content">
                <h3 id="editor-title" class="text-lg font-medium text-slate-800 mb-2">Adding New Node</h2>
                <div id="parent-selector" class="parent-selector hidden">
                    <label for="parent-select" class="block text-sm font-medium text-gray-700">Parent:</label>
                    <select id="parent-select" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                        <option value="root">Root</option>
                    </select>
                </div>

                <label for="element-name" class="block text-sm font-medium text-gray-700">Name:</label>
                <input type="text" id="element-name" class="mt-1 p-2 w-full border rounded-md">

                <label for="editor-description" class="block text-sm font-medium text-gray-700 mt-2">Description:</label>
                <div class="editor-toolbar">
                    <button type="button" onclick="formatText('bold')"><b>B</b></button>
                    <button type="button" onclick="formatText('italic')"><i>I</i></button>
                    <button type="button" onclick="formatText('underline')"><u>U</u></button>
                </div>
                <textarea id="editor-description" class="editor-textarea"></textarea>

                <label for="editor-code" class="block text-sm font-medium text-gray-700 mt-2">Code (Optional):</label>
                <select id="language-select" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                    <option value="java">Java</option>
                    <option value="python">Python</option>
                    <option value="sql">SQL</option>
                </select>
                <textarea id="editor-code" class="editor-textarea"></textarea>

                <div class="mt-4 flex justify-end gap-2">
                    <button id="cancel-button" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded text-sm font-medium">Cancel</button>
                    <button id="save-button" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-sm font-medium">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isPanelCollapsed = false;
        let isTreeView = true;
        let currentData = {};
        let activeLanguage = 'Java';
        let selectedParent = 'root';
        let currentlySelectedNode = null;

        const panelToggle = document.getElementById('panel-toggle');
        const viewToggle = document.getElementById('view-toggle');
        const leftPanel = document.getElementById('left-panel');
        const jsonTree = document.getElementById('json-tree');
        const contentPanel = document.getElementById('content-panel');
        const searchInput = document.getElementById('search-input');
        const addButton = document.getElementById('add-button');
        const addButtonText = document.getElementById('add-button-text');

        const descriptionSection = document.getElementById('description-section');
        const codeSection = document.getElementById('code-section');
        const childrenSection = document.getElementById('children-section');

        const editorModal = document.getElementById('editor-modal');
        const editorTitle = document.getElementById('editor-title');
        const elementNameInput = document.getElementById('element-name');
        const editorDescriptionTextarea = document.getElementById('editor-description');
        const editorCodeTextarea = document.getElementById('editor-code');
        const languageSelect = document.getElementById('language-select');
        const cancelButton = document.getElementById('cancel-button');
        const saveButton = document.getElementById('save-button');
        const parentSelector = document.getElementById('parent-selector');
        const parentSelect = document.getElementById('parent-select');

        const jsonData = {
            "tree": {
                "Programming": {
                    "description": "Programming Languages and Concepts",
                    "children": {
                        "SQL": {
                            "description": "Structured Query Language",
                            "codes": {
                                "Java": "",
                                "Python": "# SQLAlchemy Example\nengine = create_engine('postgresql://user:pass@localhost/db')",
                                "SQL": "-- Basic Query\nSELECT * FROM users WHERE active = true;"
                            },
                            "children": {
                                "DML": {
                                    "description": "Data Manipulation Language",
                                    "children": {
                                        "SELECT": {
                                            "description": "Query to retrieve data from database",
                                            "codes": {
                                                "SQL": "SELECT column1, column2\nFROM table_name\nWHERE condition;",
                                                "Java": "ResultSet rs = stmt.executeQuery(\"SELECT * FROM users\");",
                                                "Python": "cursor.execute(\"SELECT * FROM users\")"
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            },
            "notes": {
                "SQL Best Practices": "1. Always use prepared statements\n2. Index frequently queried columns\n3. Avoid SELECT *",
                "Database Security": "1. Use parameterized queries\n2. Implement proper access controls\n3. Regular security audits",
                "Performance Tips": "1. Optimize queries using EXPLAIN\n2. Use appropriate indexes\n3. Regular maintenance"
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            currentData = jsonData.tree;
            renderNavigation(currentData);
            initializeEventListeners();
        });

        function initializeEventListeners() {
            viewToggle.addEventListener('change', () => {
                isTreeView = !isTreeView;
                currentData = isTreeView ? jsonData.tree : jsonData.notes;
                renderNavigation(currentData);
                updateAddButtonText();
                clearRightPanel();
            });

            panelToggle.addEventListener('click', () => {
                isPanelCollapsed = !isPanelCollapsed;
                leftPanel.classList.toggle('collapsed', isPanelCollapsed);
                leftPanel.style.width = isPanelCollapsed ? '0' : '18rem';
                panelToggle.querySelector('svg').style.transform = isPanelCollapsed ? 'rotate(180deg)' : '';
                viewToggle.disabled = isPanelCollapsed;
            });

            searchInput.addEventListener('input', debounce((e) => {
                const searchTerm = e.target.value.toLowerCase();
                filterItems(searchTerm);
            }, 300));

            addButton.addEventListener('click', showEditorModal);
            cancelButton.addEventListener('click', closeEditorModal);
            saveButton.addEventListener('click', saveEditorContent);
            parentSelect.addEventListener('change', () => {
                selectedParent = parentSelect.value;
            });

            updateAddButtonText();
        }

        function updateAddButtonText() {
            addButtonText.textContent = isTreeView ? 'Add Element' : 'Add Note';
        }

        function renderNavigation(data) {
            jsonTree.innerHTML = '';
            if (isTreeView) {
                renderTree(data, jsonTree);
            } else {
                renderNotes(data);
            }
        }

        function renderTree(data, container, level = 0) {
            Object.entries(data).forEach(([key, value]) => {
                const node = document.createElement('div');
                const hasChildren = value.children && Object.keys(value.children).length > 0;

                node.className = `json-key ${hasChildren ? 'expandable' : ''}`;
                node.innerHTML = `<span class="truncate">${key}</span>`;
                node.dataset.nodePath = key;

                if (hasChildren) {
                    const childContainer = document.createElement('div');
                    childContainer.className = 'json-children';
                    renderTree(value.children, childContainer, level + 1);

                    node.addEventListener('click', (e) => {
                        e.stopPropagation();
                        selectTreeNode(node.dataset.nodePath);
                        node.classList.toggle('expanded');
                        childContainer.classList.toggle('expanded');
                        showContent(value, key);
                    });

                    container.appendChild(node);
                    container.appendChild(childContainer);
                } else {
                    node.addEventListener('click', (e) => {
                        e.stopPropagation();
                        selectTreeNode(node.dataset.nodePath);
                        showContent(value, key);
                    });
                    container.appendChild(node);
                }
            });
        }
        function selectTreeNode(nodePath) {
           // Remove the "active" class from any previously selected node
            document.querySelectorAll('.json-key').forEach(el => el.classList.remove('active'));

            // Find the corresponding node and add the "active" class
            const nodeElements = document.querySelectorAll('.json-key');
            nodeElements.forEach(nodeElement => {
                if (nodeElement.dataset.nodePath === nodePath) {
                    nodeElement.classList.add('active');
                }
            });
        }

        function renderNotes(notes) {
            Object.entries(notes).forEach(([key, value]) => {
                const note = document.createElement('div');
                note.className = 'note-item';
                note.innerHTML = `
                    <div class="font-medium text-sm">${key}</div>
                    <div class="text-xs text-slate-500 mt-1 line-clamp-2">${value}</div>
                `;
                note.addEventListener('click', () => showContent({
                    description: value,
                    type: 'note'
                }, key));
                jsonTree.appendChild(note);
            });
        }
        function clearRightPanel() {
            descriptionSection.innerHTML = '';
            codeSection.innerHTML = '';
            childrenSection.innerHTML = '';
        }

        function showContent(item, itemName) {
            clearRightPanel();
            currentlySelectedNode = item;

            descriptionSection.innerHTML = item.description ? `
                <h3 class="text-lg font-medium text-slate-800">Description</h3>
                <p class="mt-2 text-slate-600">${item.description}</p>
            ` : '';

            codeSection.innerHTML = item.codes ? `
                <h3 class="text-lg font-medium text-slate-800 mt-4">Code</h3>
                <div class="flex gap-1 p-2 bg-slate-50 border-b border-slate-200 overflow-x-auto">
                    ${Object.keys(item.codes).map(lang => `
                        <button class="code-tab ${lang === activeLanguage ? 'active' : ''}"
                                data-lang="${lang}">${lang}</button>
                    `).join('')}
                </div>
                <div class="bg-slate-900">
                    ${Object.entries(item.codes).map(([lang, code]) => `
                        <pre class="code-block ${lang === activeLanguage ? '' : 'hidden'}" style="margin: 0;">
                            <code class="language-${lang.toLowerCase()}">${code}</code>
                        </pre>
                    `).join('')}
                </div>
            ` : '';

            if (item.children && Object.keys(item.children).length > 0) {
                let childrenListHTML = `<h3 class="text-lg font-medium text-slate-800 mt-4">Children</h3><ul>`;
                Object.keys(item.children).forEach(childName => {
                    childrenListHTML += `<li><a href="#" data-child-name="${childName}" class="text-blue-500 hover:underline">${childName}</a></li>`;
                });
                childrenListHTML += `</ul>`;
                childrenSection.innerHTML = childrenListHTML;

                // Add event listeners to the children links
                document.querySelectorAll('#children-section a').forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const childName = link.dataset.childName;
                        const childItem = item.children[childName];
                        showContent(childItem, childName); // Display child's content
                        selectTreeNode(childName);
                    });
                });
            } else {
                childrenSection.innerHTML = ''; // Clear if no children
            }

            document.querySelectorAll('.code-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    activeLanguage = tab.dataset.lang;
                    document.querySelectorAll('.code-tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.code-block').forEach(block => block.classList.add('hidden'));
                    tab.classList.add('active');
                    const activeBlock = document.querySelector(`.code-block code.language-${activeLanguage.toLowerCase()}`).closest('.code-block');
                    activeBlock.classList.remove('hidden');
                    Prism.highlightElement(activeBlock.querySelector('code'));
                });
            });

            Prism.highlightAll();
        }

        function showEditorModal() {
            editorModal.style.display = 'block';
            elementNameInput.value = '';
            editorDescriptionTextarea.value = '';
            editorCodeTextarea.value = '';
            languageSelect.value = 'java';

            if (isTreeView) {
                editorTitle.textContent = 'Add New Element';
                parentSelector.classList.remove('hidden');
                populateParentSelector();
            } else {
                editorTitle.textContent = 'Add New Note';
                parentSelector.classList.add('hidden');
            }
        }

        function closeEditorModal() {
            editorModal.style.display = 'none';
        }

        function saveEditorContent() {
            const name = elementNameInput.value;
            const description = editorDescriptionTextarea.value;
            const code = editorCodeTextarea.value;
            const language = languageSelect.value;

            if (!name) {
                alert('Please enter a name.');
                return;
            }

            if (isTreeView) {
                const newNode = {
                    description: description,
                    codes: {
                        [language]: code
                    },
                    children: {}
                };

                if (selectedParent === 'root') {
                    jsonData.tree[name] = newNode;
                } else {
                     // Find the parent node and add the new node to its children
                    const parentNode = findNodeByPath(jsonData.tree, selectedParent);
                    if (parentNode && parentNode.children) {
                         parentNode.children[name] = newNode;
                    } else {
                         console.error("Parent node not found or has no children property.");
                    }
                }

                currentData = jsonData.tree;
                renderNavigation(currentData);
            } else {
                jsonData.notes[name] = description;
                currentData = jsonData.notes;
                renderNavigation(currentData);
            }

            closeEditorModal();
        }
        function findNodeByPath(data, path) {
            const pathParts = path.split('/');
            let currentNode = data;

            for (const part of pathParts) {
                if (currentNode && currentNode.children && currentNode.children[part]) {
                    currentNode = currentNode.children[part];
                } else {
                    return null; // Node not found
                }
            }

            return currentNode;
        }

        function populateParentSelector() {
            parentSelect.innerHTML = '<option value="root">Root</option>'; // Reset options
            generateParentOptions(jsonData.tree, '', parentSelect);
        }

        function generateParentOptions(data, currentPath, selectElement) {
            for (const key in data) {
                if (data.hasOwnProperty(key)) {
                    const newPath = currentPath ? `${currentPath}/${key}` : key;
                    const option = document.createElement('option');
                    option.value = newPath;
                    option.textContent = newPath;
                    selectElement.appendChild(option);

                    if (data[key].children) {
                        generateParentOptions(data[key].children, newPath, selectElement);
                    }
                }
            }
        }

        function formatText(command) {
            document.execCommand(command, false, null);
        }

        function filterItems(searchTerm) {
            if (!searchTerm) {
                currentData = isTreeView ? jsonData.tree : jsonData.notes;
                renderNavigation(currentData);
                return;
            }

            const filteredData = isTreeView
                ? filterTree(jsonData.tree, searchTerm)
                : filterNotes(jsonData.notes, searchTerm);
            renderNavigation(filteredData);
        }

        function filterTree(data, term) {
            const filtered = {};

            Object.entries(data).forEach(([key, value]) => {
                if (key.toLowerCase().includes(term) ||
                    value.description?.toLowerCase().includes(term)) {
                    filtered[key] = {...value};
                } else if (value.children) {
                    const filteredChildren = filterTree(value.children, term);
                    if (Object.keys(filteredChildren).length > 0) {
                        filtered[key] = {
                            ...value,
                            children: filteredChildren
                        };
                    }
                }
            });

            return filtered;
        }

        function filterNotes(notes, term) {
            return Object.fromEntries(
                Object.entries(notes).filter(([key, value]) =>
                    key.toLowerCase().includes(term) ||
                    value.toLowerCase().includes(term)
                )
            );
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
    </script>
</body>
</html>
