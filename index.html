<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <!-- Home-screen app: full screen on iPhone/Android (Share → Add to Home Screen), dark status bar -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workbook">
  <title>Login - Language Studio</title>
  <script>
    if (localStorage.getItem('theme') === 'dark' ||
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <style>
    :root { color-scheme: dark; }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      padding: 20px;
    }

    .login-shell {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(92vw, 560px);
      padding: 8px 10px 8px 8px;
      border-radius: 9999px;
      background: rgba(17, 17, 17, 0.96);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.02), 0 12px 30px rgba(0,0,0,0.35);
    }

    .login-error {
      display: none;
      margin-top: 10px;
      color: #fca5a5;
      font-size: 12px;
      line-height: 1.4;
      min-height: 18px;
    }

    .login-error.visible {
      display: block;
    }

    .google-btn {
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      box-shadow: 0 4px 12px rgba(255,255,255,0.08);
    }

    .google-btn svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    .login-form {
      display: flex;
      align-items: center;
      flex: 1;
      gap: 8px;
      min-width: 0;
    }

    .login-form input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
      padding: 10px 8px;
      letter-spacing: 0.01em;
    }

    .login-form input::placeholder {
      color: rgba(255,255,255,0.55);
    }

    .submit-btn {
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: #fff;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .submit-btn svg {
      width: 16px;
      height: 16px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <button id="google-signin" type="button" class="google-btn" aria-label="Sign in with Google">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
      </svg>
    </button>

    <form id="access-code-form" class="login-form">
      <input id="access-code" type="password" placeholder="Enter Access Code" autocomplete="off" />
      <button type="submit" class="submit-btn" aria-label="Submit access code">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h12M13 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </div>
  <div id="login-error" class="login-error" aria-live="polite"></div>

  <script>
    const firebaseConfig = {
      apiKey: 'AIzaSyCBH192yfKBuy_9P3NcqLtvQMt5XN7Fofk',
      authDomain: 'udaykajananotes.firebaseapp.com',
      databaseURL: 'https://udaykajananotes-default-rtdb.asia-southeast1.firebasedatabase.app',
      projectId: 'udaykajananotes',
      storageBucket: 'udaykajananotes.firebasestorage.app',
      messagingSenderId: '128489649264',
      appId: '1:128489649264:web:4a4c704c746ffa5500b0b5',
      measurementId: 'G-L313DMGD6Z'
    };

    const firebaseApp = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Keep the sign-in on this device until Logout (survives closing the browser)
    const persistenceReady = auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .catch(err => console.warn('Could not set sign-in persistence', err));

    // Remember how this device signed in, so the app knows the role (access code = admin, Google = reader)
    function rememberLogin(user, method) {
      const loginMethod = method
        || localStorage.getItem('loginMethod')
        || (user.providerData.some(({ providerId }) => providerId === 'password') ? 'access-code' : 'google');
      localStorage.setItem('loginMethod', loginMethod);
      localStorage.setItem('userRole', loginMethod === 'access-code' ? 'admin' : 'reader');
    }

    function getRedirectTarget() {
      const requested = new URLSearchParams(window.location.search).get('redirect');
      if (requested && requested.startsWith('/') && !requested.startsWith('//')) {
        return requested;
      }
      return '/application.html';
    }

    function buildSyntheticCredentials(code) {
      const normalized = String(code || '').trim();
      if (!normalized) {
        return null;
      }

      const generatedCredential = normalized.toLowerCase();
      const email = `${generatedCredential}@udaykajananotes.firebaseapp.com`;
      const password = `${generatedCredential}@udaykajananotes.firebaseapp.com`;

      return { email, password };
    }

    // Already signed in on this device? Go straight on instead of asking again.
    // (Skipped while a sign-in below is in progress — it redirects by itself.)
    let signingIn = false;
    auth.onAuthStateChanged((user) => {
      if (!user || signingIn) return;
      // Guard against a redirect loop: if the app sent us straight back, show the form instead
      const lastForward = Number(sessionStorage.getItem('loginAutoForwardAt') || 0);
      if (Date.now() - lastForward < 10000) return;
      sessionStorage.setItem('loginAutoForwardAt', String(Date.now()));
      rememberLogin(user);
      window.location.replace(getRedirectTarget());
    });

    const loginError = document.getElementById('login-error');
    const showLoginError = (message) => {
      loginError.textContent = message;
      loginError.classList.add('visible');
    };
    const clearLoginError = () => {
      loginError.textContent = '';
      loginError.classList.remove('visible');
    };

    const googleBtn = document.getElementById('google-signin');
    googleBtn.addEventListener('click', async () => {
      clearLoginError();
      signingIn = true;
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await persistenceReady;
        const result = await auth.signInWithPopup(provider);
        rememberLogin(result.user, 'google');
        window.location.href = getRedirectTarget();
      } catch (err) {
        // Phones often block the popup: sign in on a full page instead (we come back here signed in)
        if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(err.code)) {
          localStorage.setItem('loginMethod', 'google');
          signingIn = false;
          auth.signInWithRedirect(provider);
          return;
        }
        signingIn = false;
        console.error('Google sign-in failed', err);
        showLoginError('Google sign-in failed. Please try again.');
      }
    });

    // Back from a full-page Google sign-in: report a failure (success is handled above)
    auth.getRedirectResult().catch((err) => {
      console.error('Google sign-in failed', err);
      showLoginError('Google sign-in failed. Please try again.');
    });

    const accessForm = document.getElementById('access-code-form');
    const accessCodeInput = document.getElementById('access-code');

    accessForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearLoginError();
      const code = accessCodeInput.value.trim();

      if (!code) {
        showLoginError('Please enter an access code.');
        accessCodeInput.focus();
        return;
      }

      const synthetic = buildSyntheticCredentials(code);
      if (!synthetic) {
        showLoginError('Please enter a valid access code.');
        return;
      }

      signingIn = true;
      try {
        await persistenceReady;
        const result = await auth.signInWithEmailAndPassword(synthetic.email, synthetic.password);
        rememberLogin(result.user, 'access-code');
        window.location.href = getRedirectTarget();
      } catch (err) {
        signingIn = false;
        console.error('Access code sign-in failed', err);
        showLoginError('Invalid access code. Please make sure the Firebase Auth user exists with the generated email/password.');
      }
    });
  </script>
</body>
</html>
