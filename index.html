<!DOCTYPE html>
<html>
<head>
    <title>Firebase Realtime Database Example</title>
</head>
<body>
    <h1>Firebase Realtime Database Example</h1>

    <div>
        <label for="pushDataInput">Data to Push:</label>
        <input type="text" id="pushDataInput" placeholder="Enter data to push">
        <button onclick="pushData()">Push Data</button>
    </div>

    <div>
        <label for="pulledDataOutput">Pulled Data:</label>
        <input type="text" id="pulledDataOutput" readonly>
        <button onclick="pullData()">Pull Data</button>
    </div>

    <script type="module">
        // Import the functions from the SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-analytics.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-database.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCBH192yfKBuy_9P3NcqLtvQMt5XN7Fofk",
            authDomain: "udaykajananotes.firebaseapp.com",
            databaseURL: "https://udaykajananotes-default-rtdb.asia-southeast1.firebasedatabase.app", // Updated database URL
            projectId: "udaykajananotes",
            storageBucket: "udaykajananotes.firebasestorage.app",
            messagingSenderId: "128489649264",
            appId: "1:128489649264:web:4a4c704c746ffa5500b0b5",
            measurementId: "G-L313DMGD6Z"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        let analytics;
        try {
            analytics = getAnalytics(app);
        } catch (e) {
            console.warn("Analytics are not enabled in Firebase. Please follow the configuration setup to start using.");
        }
        const database = getDatabase(app);

        // Make functions available globally
        window.pushData = async function() {
            const dataToPush = document.getElementById('pushDataInput').value;
            const dbRef = ref(database, 'myData');

            try {
                await set(dbRef, dataToPush);
                console.log('Data pushed successfully');
                alert('Data pushed successfully');
            } catch (error) {
                console.error('Error pushing data:', error);
                alert('Error pushing data: ' + error.message);
            }
        };

        window.pullData = async function() {
            const dbRef = ref(database, 'myData');
            try {
                const snapshot = await get(dbRef);
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    document.getElementById('pulledDataOutput').value = data;
                    console.log("Data pulled successfully");
                } else {
                    console.log("No data available");
                    document.getElementById('pulledDataOutput').value = 'No data available';
                }
            } catch (error) {
                console.error('Error pulling data:', error);
                document.getElementById('pulledDataOutput').value = 'Error occurred: ' + error.message;
            }
        };
    </script>
</body>
</html>
