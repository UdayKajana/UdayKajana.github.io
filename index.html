<body>
    <div class="path-container ribbon" id="path-container"></div>

    <div class="container">

        </div>

        <!-- Right section - Description and Code -->

            <div class="s3">

                        <span class="language-option" data-lang="python">Python</span>
                        <span class="language-option" data-lang="sql">SQL</span>
                    </div>
                    <button class="copy-button">Copy Code</button>
                </div>
                <pre><code id="code-block" class="language-java"></code></pre>
            </div>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu">
        <div class="context-menu-item" id="add-sibling">Add Sibling Element</div>
        <div class="context-menu-item" id="add-child">Add Child Element</div>
    </div>

    <!-- Add Prism.js for syntax highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/prism.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/components/prism-sql.min.js"></script>

    <div id="context-menu" class="context-menu">
        <div class="context-menu-item" id="add-sibling">Add Sibling Element</div>
        <div class="context-menu-item" id="add-child">Add Child Element</div>
    </div>

    <script>
        // Previous variables and constants remain the same
        const jsonData = {
            "TreeElement_StructuredStreaming": {
                "floatingCard": {
                    "header": "Structured Streaming",
                    "description": "Structured Streaming is a scalable and fault-tolerant stream processing engine built on top of Apache Spark. It allows you to process data streams in a similar manner to batch processing.",
                    "code": {
                        "java": "// Java Example\nSparkSession spark = SparkSession\n    .builder()\n    .appName(\"StreamingExample\")\n    .getOrCreate();",
                        "python": "# Python Example\nspark = SparkSession\\\n    .builder\\\n    .appName(\"StreamingExample\")\\\n    .getOrCreate()",
                        "sql": "-- SQL Example\nSELECT * \nFROM streaming_table\nWHERE value > 100;"
                    }
                },
                "children": {
                    "TreeElement_Concepts": {
                        "floatingCard": {
                            "header": "Streaming Concepts",
                            "description": "Core concepts of structured streaming include micro-batch processing, event-time processing, stateful operations, and exactly-once processing semantics.",
                            "code": {
                                "java": "// Java Streaming Concepts\npublic class StreamingConcepts {\n    public void processStream() {\n        // Stateful stream processing\n    }\n}",
                                "python": "# Python Streaming Concepts\nclass StreamingConcepts:\n    def process_stream(self):\n        # Stateful stream processing\n        pass",
                                "sql": "-- SQL Streaming Concepts\n-- Window-based aggregations\nSELECT window, COUNT(*)\nFROM stream_table\nGROUP BY window"
                            }
                        },
                        "children": {
                            "TreeElement_MicroBatching": {
                                "floatingCard": {
                                    "header": "Micro-Batching",
                                    "description": "Micro-batching is a technique where stream processing occurs in small, discrete batches rather than processing each record individually.",
                                    "code": {
                                        "java": "// Micro-Batching Example\npublic void processMicroBatch() {\n    // Micro-batch processing logic\n    StreamingQuery query = spark.readStream()\n        .format(\"kafka\")\n        .option(\"kafka.bootstrap.servers\", \"localhost:9092\")\n        .load();\n}",
                                        "python": "# Micro-Batching Example\nquery = spark.readStream\\\n    .format(\"kafka\")\\\n    .option(\"kafka.bootstrap.servers\", \"localhost:9092\")\\\n    .load()",
                                        "sql": "-- Micro-Batching SQL\nSELECT * FROM stream_table\nWHERE time_window = '5 minutes'"
                                    }
                                },
                                "children": {
                                    "TreeElement_WindowOperations": {
                                        "floatingCard": {
                                            "header": "Window Operations",
                                            "description": "Window operations allow processing of streaming data within defined time intervals, enabling aggregations and complex event processing.",
                                            "code": {
                                                "java": "// Window Operations Example\nDataset<Row> windowedStream = spark\n    .readStream()\n    .groupBy(window(col(\"timestamp\"), \"10 minutes\"))\n    .agg(sum(\"value\"));",
                                                "python": "# Window Operations Example\nwindowed_stream = spark\\\n    .readStream\\\n    .groupBy(window(col(\"timestamp\"), \"10 minutes\"))\\\n    .agg(sum(\"value\"))",
                                                "sql": "-- Window Operations\nSELECT window, SUM(value)\nFROM stream_table\nGROUP BY window(timestamp, '10 minutes');"
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        };

        const pathContainer = document.getElementById('path-container');
        const jsonContainer = document.getElementById('json-container');
        const descriptionContainer = document.getElementById('description-container');
        const descriptionText = document.getElementById('description-text');
        const codeBlock = document.getElementById('code-block');
        const languageOptions = document.querySelectorAll('.language-option');

        let currentSelectedPath = '';
        let longPressTimer;
        let isLongPress = false;
        const contextMenu = document.getElementById('context-menu');
        function getCardDataFromPath(path) {
            // Navigate through the nested JSON structure to find the card data
            let currentObj = jsonData;
            for (let key of path) {
                if (!currentObj || !currentObj[key]) return null;
                currentObj = currentObj[key];
            }
            return currentObj.floatingCard || null;
        }
        function initializeCopyButton() {
            const copyButton = document.querySelector('.copy-button');
            const codeBlock = document.getElementById('code-block');

            copyButton.addEventListener('click', () => {
                // Use navigator.clipboard for modern browsers
                navigator.clipboard.writeText(codeBlock.textContent.trim())
                    .then(() => {
                        // Visual feedback
                        copyButton.textContent = 'Copied!';
                        copyButton.classList.add('copied');

                        // Revert back after 2 seconds
                        setTimeout(() => {
                            copyButton.textContent = 'Copy Code';
                            copyButton.classList.remove('copied');
                        }, 2000);
                    })
                    .catch(err => {
                        // Fallback method if clipboard API fails
                        const tempTextArea = document.createElement('textarea');
                        tempTextArea.value = codeBlock.textContent.trim();
                        document.body.appendChild(tempTextArea);
                        tempTextArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(tempTextArea);

                        // Show copied feedback
                        copyButton.textContent = 'Copied!';
                        copyButton.classList.add('copied');

                        setTimeout(() => {
                            copyButton.textContent = 'Copy Code';
                            copyButton.classList.remove('copied');
                        }, 2000);
                    });
            });
        }

        function createJsonTree(data, container, path = []) {
            for (const key in data) {
                if (key.startsWith("TreeElement_")) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'json-key-wrapper';

                    const keyElement = document.createElement('div');
                    keyElement.className = 'json-key';
                    keyElement.textContent = key.substring(12);
                    keyElement.dataset.path = [...path, key].join('.');

                    const hasChildren = data[key].children && Object.keys(data[key].children).length > 0;

                    if (hasChildren) {
                        keyElement.classList.add('expandable');
                        const childrenElement = document.createElement('div');
                        childrenElement.className = 'json-children';
                        createJsonTree(data[key].children, childrenElement, [...path, key]);
                        wrapper.appendChild(childrenElement);

                        keyElement.addEventListener('click', (event) => {
                            event.stopPropagation();
                            keyElement.classList.toggle('expanded');
                            childrenElement.classList.toggle('expanded');
                        });
                    }

                    // Ensure click event for all elements, not just those with children
                    keyElement.addEventListener('click', (event) => {
                        // Check if floatingCard exists, even for elements without children
                        if (data[key].floatingCard) {
                            const cardData = data[key].floatingCard;
                            currentSelectedPath = keyElement.dataset.path.split('.');
                            updatePathDisplay();
                            updateDescriptionAndCode(cardData);
                        }
                    });

                    wrapper.appendChild(keyElement);
                    container.appendChild(wrapper);
                }
            }
        }
        function updateCodeBlock(codeData, lang = 'java') {
            codeBlock.className = `language-${lang}`;
            codeBlock.textContent = codeData[lang] || '';
            Prism.highlightElement(codeBlock);
        }
        document.addEventListener('contextmenu', function (event) {
            event.preventDefault();
        });

        document.addEventListener('click', function (event) {
            contextMenu.style.display = 'none'; // Hide if click is outside the menu
        });
        contextMenu.addEventListener('mouseenter', function () {
            contextMenu.style.display = 'block';
        });

        contextMenu.addEventListener('mouseleave', function () {
            // Keep context menu open unless an option is selected
            if (!isOptionSelected) {
                contextMenu.style.display = 'block'; // Keep it visible
            }
        });

        let isOptionSelected = false;

        function updatePathDisplay() {
            pathContainer.innerHTML = '';
            currentSelectedPath.forEach((pathItem, index) => {
                const itemSpan = document.createElement('span');
                itemSpan.className = 'path-item';
                itemSpan.textContent = index === currentSelectedPath.length - 1
                    ? pathItem.substring(12)
                    : pathItem.substring(12);
                if (index === currentSelectedPath.length - 1) {
                    itemSpan.classList.add('active');
                }
                pathContainer.appendChild(itemSpan);
            });
        }

        function updateDescriptionAndCode(cardData) {
            descriptionText.textContent = cardData.description;
            updateCodeBlock(cardData.code);
        }

        function initializeLanguageOptions() {
            const languageOptions = document.querySelectorAll('.language-option');
            languageOptions.forEach(option => {
                option.addEventListener('click', () => {
                    const selectedLang = option.dataset.lang;
                    languageOptions.forEach(opt => opt.classList.remove('active'));
                    option.classList.add('active');
                    const cardData = getCardDataFromPath(currentSelectedPath);
                    if (cardData) updateCodeBlock(cardData.code, selectedLang);
                });
            });
        }

        function handleLongPress(e, element) {
            isLongPress = false;
            longPressTimer = setTimeout(() => {
                isLongPress = true;
                showContextMenu(e, element);
            }, 4000); // 4 seconds long press
        }

        function cancelLongPress() {
            clearTimeout(longPressTimer);
            isLongPress = false;
        }
        function cancelEdit() {
            const s2 = document.querySelector('.s2');
            s2.innerHTML = `
        <div id="description-container">
            <p id="description-text"></p>
        </div>
        <div class="s3">
            <div class="language-selection">
                <div class="language-options">
                    <span class="language-option active" data-lang="java">Java</span>
                    <span class="language-option" data-lang="python">Python</span>
                    <span class="language-option" data-lang="sql">SQL</span>
                </div>
                <button class="copy-button">Copy Code</button>
            </div>
            <pre><code id="code-block" class="language-java"></code></pre>
        </div>
    `;

            // Re-initialize language options and copy button
            initializeLanguageOptions();
            initializeCopyButton();

            // Restore the previous selected element's content
            const cardData = getCardDataFromPath(currentSelectedPath);
            if (cardData) {
                updateDescriptionAndCode(cardData);
            }
        }
        function showContextMenu(e, element) {
            e.preventDefault();
            const rect = element.getBoundingClientRect();
            contextMenu.style.display = 'block';
            contextMenu.style.left = `${rect.left}px`;
            contextMenu.style.top = `${rect.bottom}px`;

            const path = element.dataset.path;

            document.getElementById('add-sibling').onclick = () => {
                hideContextMenu();
                enterEditMode(path.split('.').slice(0, -1), 'sibling');
                isOptionSelected = true;
            };

            document.getElementById('add-child').onclick = () => {
                hideContextMenu();
                enterEditMode(path.split('.'), 'child');
                isOptionSelected = true;
            };
        }

        function hideContextMenu() {
            contextMenu.style.display = 'none';
        }

        // Close context menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!contextMenu.contains(e.target)) {
                hideContextMenu();
            }
        });

        function enterEditMode(path, mode) {
            const s2 = document.querySelector('.s2');
            s2.innerHTML = `
                <div class="edit-mode">
                    <h3>Add New ${mode === 'sibling' ? 'Sibling' : 'Child'} Element</h3>
                    <input type="text" id="element-name" placeholder="Element Name (without TreeElement_ prefix)">
                    <textarea id="element-description" placeholder="Description"></textarea>
                    <h4>Code Samples</h4>
                    <textarea id="java-code" placeholder="Java Code"></textarea>
                    <textarea id="python-code" placeholder="Python Code"></textarea>
                    <textarea id="sql-code" placeholder="SQL Code"></textarea>
                    <div class="edit-mode-buttons">
                        <button class="cancel-button" onclick="cancelEdit()">Cancel</button>
                        <button class="save-button" onclick="saveNewElement('${path.join("','")},${mode}')">Save</button>
                    </div>
                </div>
            `;
        }
        function createJsonTree(data, container, path = []) {
            for (const key in data) {
                if (key.startsWith("TreeElement_")) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'json-key-wrapper';

                    const keyElement = document.createElement('div');
                    keyElement.className = 'json-key';
                    keyElement.textContent = key.substring(12);
                    keyElement.dataset.path = [...path, key].join('.');

                    const hasChildren = data[key].children && Object.keys(data[key].children).length > 0;

                    if (hasChildren) {
                        keyElement.classList.add('expandable');
                        const childrenElement = document.createElement('div');
                        childrenElement.className = 'json-children';
                        createJsonTree(data[key].children, childrenElement, [...path, key]);
                        wrapper.appendChild(childrenElement);

                        keyElement.addEventListener('click', (event) => {
                            if (!isLongPress) {
                                event.stopPropagation();
                                keyElement.classList.toggle('expanded');
                                childrenElement.classList.toggle('expanded');
                            }
                        });
                    }

                    // Update long press handlers
                    let pressTimer;
                    let startX;
                    let startY;
                    const moveThreshold = 10;

                    keyElement.addEventListener('mousedown', (e) => {
                        startX = e.clientX;
                        startY = e.clientY;
                        pressTimer = setTimeout(() => {
                            isLongPress = true;
                            showContextMenu(e, keyElement);
                        }, 1000); // Reduced to 1 second
                    });

                    keyElement.addEventListener('mousemove', (e) => {
                        if (pressTimer && (
                            Math.abs(e.clientX - startX) > moveThreshold ||
                            Math.abs(e.clientY - startY) > moveThreshold
                        )) {
                            clearTimeout(pressTimer);
                        }
                    });

                    keyElement.addEventListener('mouseup', () => {
                        clearTimeout(pressTimer);
                        setTimeout(() => { isLongPress = false; }, 100);
                    });

                    keyElement.addEventListener('mouseleave', () => {
                        clearTimeout(pressTimer);
                        setTimeout(() => { isLongPress = false; }, 100);
                    });

                    if (data[key].floatingCard) {
                        keyElement.addEventListener('click', (event) => {
                            if (!isLongPress) {
                                const cardData = data[key].floatingCard;
                                currentSelectedPath = keyElement.dataset.path.split('.');
                                updatePathDisplay();
                                updateDescriptionAndCode(cardData);
                            }
                        });
                    }

                    wrapper.appendChild(keyElement);
                    container.appendChild(wrapper);
                }
            }
        }

        // Update path display handling
        function updatePathDisplay() {
            pathContainer.innerHTML = '';
            let pathSoFar = [];

            currentSelectedPath.forEach((pathItem, index) => {
                pathSoFar.push(pathItem);
                const itemSpan = document.createElement('span');
                itemSpan.className = 'path-item';
                itemSpan.textContent = pathItem.substring(12);

                if (index === currentSelectedPath.length - 1) {
                    itemSpan.classList.add('active');
                }

                // Add click handler for navigation
                itemSpan.addEventListener('click', () => {
                    navigateToPath(pathSoFar);
                });

                pathContainer.appendChild(itemSpan);
            });
        }

        // Add navigation function
        function navigateToPath(path) {
            let currentElement = jsonContainer;
            path.forEach(item => {
                const element = currentElement.querySelector(`[data-path$="${item}"]`);
                if (element) {
                    const parentWrapper = element.closest('.json-key-wrapper');
                    if (parentWrapper) {
                        const children = parentWrapper.querySelector('.json-children');
                        if (children) {
                            element.classList.add('expanded');
                            children.classList.add('expanded');
                        }
                    }
                    currentElement = element.parentElement;
                }
            });
        }

        function saveNewElement(pathAndMode) {
            const [path, mode] = pathAndMode.split(',');
            const elementName = document.getElementById('element-name').value.trim();
            if (!elementName) {
                alert('Please enter an element name');
                return;
            }

            const newKey = `TreeElement_${elementName}`;
            const newElement = {
                floatingCard: {
                    header: elementName,
                    description: document.getElementById('element-description').value,
                    code: {
                        java: document.getElementById('java-code').value,
                        python: document.getElementById('python-code').value,
                        sql: document.getElementById('sql-code').value
                    }
                },
                children: {}
            };

            // Navigate to the correct position in the JSON data
            let currentObj = jsonData;
            const pathArray = path.split(',').filter(Boolean);

            for (let i = 0; i < pathArray.length; i++) {
                currentObj = mode === 'child' && i === pathArray.length - 1
                    ? currentObj[pathArray[i]].children
                    : currentObj[pathArray[i]].children;
            }

            // Add the new element
            currentObj[newKey] = newElement;

            // Reload the tree
            jsonContainer.innerHTML = '';
            createJsonTree(jsonData, jsonContainer);

            // Reset the right panel
            cancelEdit();
        }

        // Initialize the tree
        createJsonTree(jsonData, jsonContainer);
        initializeCopyButton();
        initializeLanguageOptions();
    </script>
</body>

</html>
