<!DOCTYPE html>
<html>
<head>
    <title>My GitHub Pages Site</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
</head>
<body>
    <h1>Data from Google Sheet:</h1>
    <div id="data-container"></div>
    <script>
        const sheetID = "1G7dk0WkeO6MT3p7NfezlEYEnbdlGI_GQp4_9rZbSo2g"; // Replace with your Sheet ID
        const publicSheetURL = `https://docs.google.com/spreadsheets/d/${sheetID}/pub?output=csv`;

        function renderNavigation(data) {
            const container = document.getElementById("data-container");
            container.innerHTML = JSON.stringify(data, null, 2); // Display JSON in a readable format
        }

        let currentData = {}; // Define your currentData variable

        function loadData() {
            Papa.parse(publicSheetURL, {
                download: true,
                header: true, // Treat the first row as column headers
                complete: function(results) {
                    processData(results.data);
                },
                error: function(error) {
                    console.error("Error loading data from Google Sheet:", error);
                    document.getElementById("data-container").innerText = "Error loading data.";
                }
            });
        }

        function processData(data) {
            if (data.length === 0) {
                console.error("No data found in the Google Sheet.");
                return;
            }
            const row = data[0]; // Get the first row

            const jsonString = row["JSONData"]; // Access data from 'JSONData' column
            if (!jsonString) {
                console.error("No JSON data found in the 'JSONData' column.");
                return;
            }

            try {
                const loadedJsonData = JSON.parse(jsonString);
                console.log("Data loaded from Google Sheet:", loadedJsonData);

                currentData = loadedJsonData; // Assign to your global variable
                renderNavigation(currentData); // Use the tree portion, or just currentData

            } catch (error) {
                console.error("Error parsing JSON data:", error);
            }
        }
        window.onload = loadData;
    </script>
</body>
</html>
