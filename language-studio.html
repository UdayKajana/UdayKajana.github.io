<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Home-screen app: full screen on iPhone/Android (Share → Add to Home Screen), dark status bar -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workbook">
  <title>Language Studio</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <script>
    // Applied before first paint to avoid a light-mode flash on load.
    if (localStorage.getItem('theme') === 'dark' ||
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <style>
    :root {
      color-scheme: light;
      --panel: #ffffff;
      --panel-strong: #f8fafc;
      --border: #dbe4f0;
      --text: #0f172a;
      --muted: #475569;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --accent-dark: #1e3a8a;
      --body-grad-1: #f8fbff;
      --body-grad-2: #eef4ff;
      --glass-bg: rgba(255, 255, 255, 0.92);
      --hairline: rgba(15, 23, 42, 0.07);
    }

    :root.dark {
      color-scheme: dark;
      --panel: #1e293b;
      --panel-strong: #0f172a;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #cbd5e1;
      --accent: #3b82f6;
      --accent-soft: #1e3a8a;
      --accent-dark: #93c5fd;
      --body-grad-1: #0f172a;
      --body-grad-2: #111c33;
      --glass-bg: rgba(15, 23, 42, 0.85);
      --hairline: rgba(226, 232, 240, 0.09);
    }

    /* Edges on iPhone/Android: clear of the status bar and home bar (inside the Notes page, which
       has the status bar itself, the bottom value comes in as --safe-bottom) */
    body {
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
    }
    main { padding-bottom: calc(0.5rem + var(--safe-bottom, env(safe-area-inset-bottom, 0px))) !important; }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, var(--body-grad-1) 0%, var(--body-grad-2) 100%);
      color: var(--text);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .pill {
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0.35rem 0.7rem;
      font-size: 0.8rem;
      background: var(--panel);
      color: var(--muted);
    }

    /* Word rows: no box, no shadow, no radius — just the faintest possible
       divider between entries, so a section reads as one continuous list.
       Deliberately much fainter than the section-to-section divider below
       (var(--border)) so the two levels never get visually confused. The
       word-list wrapper (not this class) carries the vertical rhythm; the
       last row in a list has no line under it (nothing to separate it from). */
    .word-list > .compact-card + .compact-card {
      border-top: 1px solid var(--hairline);
    }

    .compact-card {
      padding: 0.4rem 0.1rem;
      background: transparent;
    }

    .compact-card:hover {
      background: var(--panel-strong);
    }

    .compact-card {
      position: relative;
    }

    /* Word card: word | reading (or "-") | meaning in fixed columns, so readings and
       meanings line up vertically across every card */
    .word-row {
      display: grid;
      grid-template-columns: minmax(0, clamp(4rem, 22%, 7.5rem)) minmax(0, clamp(5rem, 31%, 10rem)) minmax(0, 1fr);
      column-gap: 0.75rem;
      align-items: baseline;
    }

    /* Each value stays on one line; one too long for its column is swiped (or trackpad-
       scrolled) sideways inside its column, with no scrollbar. A soft fade marks the side
       that hides more text (.has-more-start / .has-more-end, set by watchCardFieldOverflow). */
    .word-row > .word-field {
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      --fade-start: 0px;
      --fade-end: 0px;
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--fade-start), #000 calc(100% - var(--fade-end)), transparent 100%);
      mask-image: linear-gradient(to right, transparent 0, #000 var(--fade-start), #000 calc(100% - var(--fade-end)), transparent 100%);
    }
    .word-row > .word-field::-webkit-scrollbar { display: none; }
    .word-row > .word-field.has-more-start { --fade-start: 0.9rem; }
    .word-row > .word-field.has-more-end { --fade-end: 0.9rem; }
    .word-field-text {
      display: inline-block;
    }

    #dictionary-list .compact-card .word-field-empty {
      opacity: 0.45;
    }

    #dictionary-list .compact-card .word-field-word {
      color: #0f172a !important;
    }

    #dictionary-list .compact-card .word-field-pronunciation {
      color: #6f7891 !important;
    }

    #dictionary-list .compact-card .word-field-meaning {
      color: #536f71 !important;
    }

    :root.dark #dictionary-list .compact-card .word-field-word {
      color: #f1f5f9 !important;
    }

    :root.dark #dictionary-list .compact-card .word-field-pronunciation {
      color: #bbc5df !important;
    }

    :root.dark #dictionary-list .compact-card .word-field-meaning {
      color: #a8c8c0 !important;
    }

    /* The card being dragged stays in place (so its section doesn't jump
       around while you're deciding where to drop it) but fades, leaving the
       floating ghost as the only thing that visibly follows the pointer. */
    .compact-card-dragging {
      opacity: 0.35;
    }

    /* The floating word that follows the pointer during a drag — a small
       pill rather than a full card, since all it needs to convey is "this
       is what's being moved." */
    .card-drag-ghost {
      position: fixed;
      z-index: 60;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      padding: 0.4rem 0.75rem;
      border-radius: 0.75rem;
      border: 1px solid var(--accent);
      background: var(--panel);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.25);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    .card-drag-ghost .card-drag-ghost-meaning {
      font-size: 0.7rem;
      font-weight: 400;
      color: var(--muted);
    }

    /* Whichever section/subsection row is currently under the pointer during
       a drag — the only valid drop targets, since a word can't be dropped
       onto another word. */
    .section-row-drop-hover > details > summary {
      background: var(--accent-soft);
      border-radius: 0.5rem;
      outline: 2px dashed var(--accent);
      outline-offset: 2px;
    }

    /* Fills over the ~1s hold — released early cancels the delete (and the
       fill resets); completing it deletes the word. */
    .card-delete-hold-overlay {
      position: absolute;
      inset: 0;
      background: rgba(225, 29, 72, 0.16);
      border-radius: 0.375rem;
      transform-origin: left;
      transform: scaleX(0);
      pointer-events: none;
    }

    .card-delete-hold-overlay.card-delete-hold-active {
      transform: scaleX(1);
      transition: transform 1s linear;
    }

    .meaning-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
      font-size: 0.75rem;
      color: #475569;
    }

    .draft-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.7rem;
      background: linear-gradient(135deg, #eff6ff 0%, #f8fbff 100%);
      border-color: #bfdbfe;
    }

    .modal-backdrop {
      display: none;
    }

    .modal-backdrop.open {
      display: flex;
    }

    /* ---------- Reading player (full screen) ---------- */
    .reading-player {
      position: fixed;
      inset: 0;
      z-index: 60;
      flex-direction: column;
      padding: calc(1rem + var(--safe-top, env(safe-area-inset-top, 0px))) 1.25rem calc(1.25rem + var(--safe-bottom, env(safe-area-inset-bottom, 0px)));
      background: radial-gradient(ellipse at 50% 35%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      color: #f8fafc;
      user-select: none;
      -webkit-user-select: none;
    }
    .reading-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .reading-section {
      min-width: 0;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #c4b5fd;
      overflow-wrap: anywhere;
    }
    .reading-close {
      flex-shrink: 0;
      width: 2.5rem;
      height: 2.5rem;
      display: grid;
      place-items: center;
      border-radius: 9999px;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.08);
    }
    .reading-close svg { width: 1.1rem; height: 1.1rem; }
    .reading-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      text-align: center;
      overflow-y: auto;
    }
    .reading-word {
      font-size: clamp(2.5rem, 11vw, 5.5rem);
      font-weight: 700;
      line-height: 1.15;
      color: #ffffff;
      overflow-wrap: anywhere;
    }
    .reading-pronunciation {
      font-size: clamp(1.25rem, 5vw, 2rem);
      color: #cbd5e1;
      overflow-wrap: anywhere;
    }
    .reading-pronunciation:empty { display: none; }
    .reading-meaning {
      max-width: 40rem;
      font-size: clamp(1.1rem, 4.5vw, 1.6rem);
      line-height: 1.4;
      color: #e2e8f0;
    }
    .reading-bottom { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .reading-position { font-size: 0.85rem; color: #94a3b8; font-variant-numeric: tabular-nums; min-height: 1.2em; }
    .reading-controls { display: flex; align-items: center; justify-content: center; gap: 2rem; }
    .reading-btn {
      width: 3.5rem;
      height: 3.5rem;
      display: grid;
      place-items: center;
      border-radius: 9999px;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.08);
      transition: transform 0.12s ease, background-color 0.15s ease, opacity 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .reading-btn svg { width: 1.6rem; height: 1.6rem; }
    .reading-btn:active { transform: scale(0.92); }
    .reading-btn:disabled { opacity: 0.35; }
    .reading-btn:focus-visible { outline: 2px solid #a78bfa; outline-offset: 3px; }
    .reading-manual-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      color: #cbd5e1;
      font-size: 0.75rem;
      cursor: pointer;
      user-select: none;
    }
    .reading-manual-toggle input {
      appearance: none;
      width: 2.25rem;
      height: 1.25rem;
      margin: 0;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.18);
      position: relative;
      transition: background-color 0.18s ease;
      cursor: pointer;
    }
    .reading-manual-toggle input::before {
      content: "";
      position: absolute;
      width: 0.9rem;
      height: 0.9rem;
      top: 0.175rem;
      left: 0.175rem;
      border-radius: 50%;
      background: #f8fafc;
      transition: transform 0.18s ease;
    }
    .reading-manual-toggle input:checked { background: #8b5cf6; }
    .reading-manual-toggle input:checked::before { transform: translateX(1rem); }
    .reading-manual-toggle input:focus-visible { outline: 2px solid #c4b5fd; outline-offset: 3px; }
    .reading-control { color: #0f172a; background: #c4b5fd; }
    .reading-control svg { width: 1.8rem; height: 1.8rem; }
    .reading-control .hidden { display: none; }

    /* Section notes */
    .section-note-holder { margin-bottom: 0.25rem; }
    .section-note-holder:empty { display: none; }
    /* Heading's clickable NOTE tag, right after the section name: small, a lighter
       violet than the heading text, filled while the note is shown. */
    .section-note-tag {
      margin-left: 0.1rem;
      padding: 0 0.35rem;
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 0.3rem;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      line-height: 1.5;
      color: #8b5cf6;
      -webkit-text-fill-color: #8b5cf6;
      text-shadow: none;
      cursor: pointer;
      user-select: none;
    }
    /* Only on an open section's heading */
    .section-group:not([open]) > summary > .section-note-tag { display: none; }
    .section-note-tag:hover { background: rgba(139, 92, 246, 0.1); }
    .section-note-tag.is-expanded { background: rgba(139, 92, 246, 0.14); border-color: rgba(139, 92, 246, 0.6); }
    .section-note-tag:focus-visible { outline: 2px solid rgba(139, 92, 246, 0.5); outline-offset: 1px; }
    .dark .section-note-tag { color: #c4b5fd; -webkit-text-fill-color: #c4b5fd; border-color: rgba(196, 181, 253, 0.35); }
    .dark .section-note-tag:hover { background: rgba(196, 181, 253, 0.12); }
    .dark .section-note-tag.is-expanded { background: rgba(196, 181, 253, 0.16); border-color: rgba(196, 181, 253, 0.6); }
    .section-note {
      border: 1px solid #e2e8f0;
      border-left: 3px solid #8b5cf6;
      border-radius: 0.5rem;
      background: #ffffff;
      cursor: default;
    }
    .section-note .ql-editor {
      padding: 0.6rem 0.8rem;
      font-size: 0.875rem;
      line-height: 1.55;
      color: #1e293b;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    #section-note-editor { height: min(55vh, 28rem); font-size: 0.95rem; }
    #section-note-modal .ql-toolbar { border-radius: 0.5rem 0.5rem 0 0; }
    #section-note-modal .ql-container { border-radius: 0 0 0.5rem 0.5rem; }
    .dark .section-note { background: #0f172a; border-color: #334155; border-left-color: #a78bfa; }
    .dark .section-note .ql-editor { color: #e2e8f0; }
    .dark #section-note-modal .ql-toolbar, .dark #section-note-modal .ql-container { border-color: #475569; }
    .dark #section-note-modal .ql-editor { color: #e2e8f0; }
    .dark #section-note-modal .ql-stroke { stroke: #cbd5e1; }
    .dark #section-note-modal .ql-fill { fill: #cbd5e1; }
    .dark #section-note-modal .ql-picker { color: #cbd5e1; }

    .section-row {
      position: relative;
      margin: 0.22rem 0;
      padding: 0.08rem 0.2rem;
    }

    /* Odd-row stripe: fades a little to the right but stays visible to the end */
    .section-row:nth-child(odd) > .section-group > summary {
      background: linear-gradient(100deg, rgba(59, 130, 246, 0.06), rgba(59, 130, 246, 0.03));
    }

    .dark .section-row:nth-child(odd) > .section-group > summary {
      background: linear-gradient(100deg, rgba(147, 197, 253, 0.07), rgba(147, 197, 253, 0.035));
    }

    .section-row-sub {
      margin-left: 0.45rem;
    }

    /* Section edge color = the section's sort priority (SECTION_EDGE_COLORS in
       js/sections.js), drawn on one line per row: beside a top-level heading, or
       as a subsection's indent line. */
    .section-row { --section-edge: #3b82f6; }
    .section-row[data-edge="red"] { --section-edge: #ef4444; }
    .section-row[data-edge="orange"] { --section-edge: #f59e0b; }
    .section-row[data-edge="green"] { --section-edge: #22c55e; }
    .section-row[data-edge="purple"] { --section-edge: #a855f7; }

    /* Top-level sections: a hair-thin colored line beside the heading only (not down
       the open body, where the subsections' own indent lines run). */
    .section-row:not(.section-row-sub) > .section-group > summary {
      position: relative;
    }

    .section-row:not(.section-row-sub) > .section-group > summary::before {
      content: "";
      position: absolute;
      left: -0.2rem;
      top: 0.3rem;
      bottom: 0.3rem;
      width: 1px;
      background: var(--section-edge);
      opacity: 0.85;
      pointer-events: none;
      /* Half a pixel: browsers round thinner widths back up, so the line is
         drawn 1px wide and scaled down, which renders finer/fainter. */
      transform: scaleX(0.5);
      transform-origin: left;
    }

    /* On high-density screens, a quarter CSS pixel (half a device pixel at 2x) */
    @media (min-resolution: 2dppx) {
      .section-row:not(.section-row-sub) > .section-group > summary::before { transform: scaleX(0.25); }
    }

    /* Triple-click color picker on the heading: numbered swatches (1 = top priority) */
    .section-edge-picker {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      cursor: auto;
    }

    .section-edge-swatch {
      width: 1.35rem;
      height: 1.35rem;
      border-radius: 999px;
      border: 2px solid transparent;
      background: var(--section-edge);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      line-height: 1;
      text-shadow: none;
      -webkit-text-fill-color: #fff;
      cursor: pointer;
    }

    .section-edge-swatch[data-edge="red"] { --section-edge: #ef4444; }
    .section-edge-swatch[data-edge="orange"] { --section-edge: #f59e0b; }
    .section-edge-swatch[data-edge="green"] { --section-edge: #22c55e; }
    .section-edge-swatch[data-edge="purple"] { --section-edge: #a855f7; }
    .section-edge-swatch[data-edge="blue"] { --section-edge: #3b82f6; }

    .section-edge-swatch.is-current {
      box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--section-edge);
    }

    .section-edge-picker .section-menu-sym-btn {
      width: 1.5rem;
      height: 1.5rem;
      font-size: 0.8rem;
      text-shadow: none;
    }

    /* Long press (3 s) toward operation mode: a soft fill sweeps across the heading */
    .section-group > summary {
      -webkit-touch-callout: none;
    }

    /* The .dark variant matches the specificity of the dark odd-row stripe, which
       would otherwise replace the fill on every other heading. */
    .section-row .section-group > summary.section-long-pressing,
    .dark .section-row .section-group > summary.section-long-pressing {
      background-image: linear-gradient(90deg, var(--accent-soft), var(--accent-soft));
      background-repeat: no-repeat;
      background-size: 0% 100%;
      animation: section-long-press 3s linear forwards;
    }

    @keyframes section-long-press {
      to { background-size: 100% 100%; }
    }

    /* Subsections: the indent (tree) line itself carries the priority color, so
       there's no second line beside it; drawn at half a pixel. */
    .section-row-sub::before {
      content: "";
      position: absolute;
      left: -0.24rem;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--section-edge);
      opacity: 0.85;
      /* Half of 1px (browsers round thinner widths back up, so scale it) */
      transform: scaleX(0.5);
      transform-origin: left;
    }

    .section-row-sub:last-child::before {
      bottom: 50%;
    }

    .section-group > summary {
      cursor: pointer;
      user-select: none;
      list-style: revert;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.025em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0.25rem 0;
      touch-action: manipulation; /* no double-tap zoom: double-tap starts reading */
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      column-gap: 0.4rem;
      line-height: 1.35;
      transition: color 0.18s ease, text-shadow 0.18s ease;
    }

    .section-group > summary:hover,
    .section-group[open] > summary {
      color: var(--accent);
      text-shadow: 0 0 14px rgba(59, 130, 246, 0.22);
    }

    .section-group > summary:hover .section-label,
    .section-group[open] > summary .section-label {
      background: linear-gradient(90deg, var(--accent-dark), var(--accent), var(--accent-dark));
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section-group > summary::marker {
      font-size: 0.6rem;
    }

    /* Long section names wrap onto a second line instead of ending in "…" */
    .section-label {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    /* The "subsections · words" count: a quiet pill marker at the heading's right edge */
    .section-count {
      display: inline-block;
      margin-left: auto;
      padding: 0 0.4em;
      border-radius: 999px;
      background: color-mix(in srgb, var(--muted) 12%, transparent);
      font-size: 0.6em;
      font-weight: 500;
      letter-spacing: 0.02em;
      line-height: 1.6;
      font-variant-numeric: tabular-nums;
      vertical-align: 0.1em;
      white-space: nowrap;
      color: var(--muted);
      -webkit-text-fill-color: var(--muted);
      opacity: 0.75;
      text-shadow: none;
    }

    .section-group .section-body {
      margin-top: 0.2rem;
    }

    .section-menu-sym-btn.section-menu-icon-danger {
      color: #e11d48;
    }

    .section-menu-sym-btn.section-menu-icon-danger:hover {
      background: rgba(225, 29, 72, 0.08);
    }

    .quick-add-mode-toggle {
      position: relative;
      display: block;
      flex-shrink: 0;
      overflow: visible;
      box-sizing: border-box;
      width: 4.4rem;
      height: 1.8rem;
      padding: 2px;
      appearance: none;
      border: 1px solid rgba(22, 101, 52, 0.3);
      border-radius: 9999px;
      background: linear-gradient(145deg, rgba(220, 252, 231, 0.92), rgba(187, 247, 208, 0.78));
      box-shadow: inset 0 1px 2px rgba(20, 83, 45, 0.13), 0 1px 4px rgba(22, 101, 52, 0.12);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .quick-add-mode-toggle.hidden { display: none; }

    .quick-add-mode-knob {
      position: absolute;
      z-index: 0;
      top: 50%;
      left: calc(25% - 0.675rem);
      width: 1.35rem;
      height: 1.35rem;
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(134, 239, 172, 0.48), rgba(34, 197, 94, 0.3));
      border: 1px solid rgba(255, 255, 255, 0.78);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.78), inset 0 -1px 2px rgba(21, 128, 61, 0.12), 0 1px 4px rgba(21, 128, 61, 0.2);
      transform: translateY(-50%);
      transition: left 220ms cubic-bezier(0.2, 0.8, 0.2, 1), background 180ms ease;
      pointer-events: none;
    }

    .quick-add-mode-toggle[aria-pressed="true"] .quick-add-mode-knob {
      left: calc(75% - 0.675rem);
    }

    .quick-add-mode-option {
      position: absolute;
      z-index: 1;
      top: 50%;
      width: 1.35rem;
      color: #166534;
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: color 150ms ease;
    }

    .quick-add-mode-japanese {
      left: 25%;
    }

    .quick-add-mode-english {
      left: 75%;
    }

    .quick-add-mode-toggle[aria-pressed="false"] .quick-add-mode-japanese,
    .quick-add-mode-toggle[aria-pressed="true"] .quick-add-mode-english {
      color: #fff;
    }

    .quick-add-mode-toggle:focus-visible {
      outline: 2px solid #14532d;
      outline-offset: 2px;
      border-radius: 9999px;
    }

    /* Deliberately no border/circle/background — just a plain red cross,
       so it reads as "discard" rather than another neutral icon button. */
    .quick-add-close-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 1.75rem;
      border-radius: 0.4rem;
      border: none;
      background: transparent;
      color: #e11d48;
      cursor: pointer;
    }

    .quick-add-close-btn:hover {
      color: #be123c;
    }

    /* Compact symbol actions in the heading's operation mode (✓ / ⤷ / ↳ / ⊕ / ✕) */
    .section-menu-sym-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1.9rem;
      height: 1.9rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1;
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }

    .section-menu-sym-btn:hover {
      background: var(--panel-strong);
      color: var(--text);
    }

    .section-menu-sym-btn.section-menu-sym-primary {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
      font-weight: 700;
    }

    .section-menu-sym-btn.section-menu-sym-primary:hover {
      background: var(--accent);
      color: #fff;
    }

    .section-menu-sym-btn:disabled,
    .section-menu-sym-btn:disabled:hover {
      opacity: 0.4;
      cursor: not-allowed;
      background: var(--panel);
      color: var(--text);
      border-color: var(--border);
    }

    /* Section operation mode on the heading (triple-tap): field + action symbols on one line */
    .section-rename-inline {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      max-width: 100%;
      cursor: auto;
    }

    .section-rename-input {
      min-width: 0;
      max-width: 100%;
      border: 1px solid var(--accent);
      border-radius: 0.4rem;
      background: var(--panel);
      padding: 0.1rem 0.4rem;
      font: inherit;
      letter-spacing: inherit;
      text-transform: uppercase;
      color: var(--text);
      outline: none;
      user-select: text;
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    /* Move/merge target suggestions: a small list under the field, only while typing */
    .section-rename-inline { position: relative; }
    .section-move-suggestions {
      position: absolute;
      top: calc(100% + 0.25rem);
      left: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      min-width: 12rem;
      max-width: min(22rem, 90vw);
      max-height: 15rem;
      overflow-y: auto;
      padding: 0.25rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: var(--panel);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
    }
    .section-move-suggestions[hidden] { display: none; }
    .section-move-suggestion {
      padding: 0.35rem 0.5rem;
      border: none;
      border-radius: 0.35rem;
      background: transparent;
      font: inherit;
      font-size: 0.8rem;
      letter-spacing: 0.02em;
      text-align: left;
      text-transform: uppercase;
      color: var(--text);
      -webkit-text-fill-color: var(--text);
      text-shadow: none;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .section-move-suggestion:hover,
    .section-move-suggestion.is-active {
      background: var(--accent-soft);
    }

    /* Operation-mode symbols: bare, colored marks (no background, border or rounding);
       hover brightens and lifts them slightly */
    .section-rename-inline .section-menu-sym-btn,
    .section-rename-inline .section-menu-sym-btn:hover,
    .section-rename-inline .section-menu-sym-btn.section-menu-sym-primary,
    .section-rename-inline .section-menu-sym-btn.section-menu-sym-primary:hover,
    .section-rename-inline .section-menu-sym-btn:disabled,
    .section-rename-inline .section-menu-sym-btn:disabled:hover {
      flex-shrink: 0;
      width: 1.5rem;
      height: 1.5rem;
      padding: 0;
      border: none;
      border-radius: 0;
      background: none;
      box-shadow: none;
      font-size: 0.95rem;
      font-weight: 700;
      text-shadow: none;
      -webkit-text-fill-color: currentColor;
    }
    .section-rename-inline .section-menu-sym-btn {
      color: var(--muted);
      transition: transform 0.12s ease, filter 0.12s ease, opacity 0.12s ease;
    }
    .section-rename-inline .section-menu-sym-btn:hover:not(:disabled) {
      transform: scale(1.15);
      filter: brightness(1.15);
    }
    .section-rename-inline .section-menu-sym-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .section-rename-inline .section-menu-sym-btn svg {
      width: 1.05rem;
      height: 1.05rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .section-rename-inline .section-menu-sym-btn.section-menu-icon-danger svg {
      width: 0.85rem;
      height: 0.85rem;
      fill: currentColor;
      stroke: none;
    }
    .section-rename-inline .section-menu-sym-btn.section-menu-sym-primary { color: var(--accent); }        /* ✓ save */
    .section-rename-inline .section-menu-sym-btn[data-ops-move] { color: #d97706; }                        /* ⤷ move/merge */
    .section-rename-inline .section-menu-sym-btn.section-op-child { color: #16a34a; }                      /* + make child */
    .section-rename-inline .section-menu-sym-btn.section-op-merge { color: #7c3aed; }                      /* merge */
    .section-rename-inline .section-menu-sym-btn.section-menu-icon-danger { color: #dc2626; }              /* delete */
    .dark .section-rename-inline .section-menu-sym-btn[data-ops-move] { color: #fbbf24; }
    .dark .section-rename-inline .section-menu-sym-btn.section-op-child { color: #4ade80; }
    .dark .section-rename-inline .section-menu-sym-btn.section-op-merge { color: #c4b5fd; }
    .dark .section-rename-inline .section-menu-sym-btn.section-menu-icon-danger { color: #f87171; }
    .section-rename-inline .section-menu-sym-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
  </style>
  <!-- Quill: the same rich-text editor (and version) the Notes pages use, for section notes -->
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
</head>
<body>
  <div class="min-h-screen">
    <style>
      #reading-button,
      #theme-toggle,
      #logout-button,
      #script-practice-hiragana,
      #script-practice-katakana,
      #script-practice-kanji {
        display: none !important;
      }
    </style>
    <button id="reading-button" type="button" aria-label="Reading" class="hidden">Read</button>
    <button id="theme-toggle" type="button" aria-label="Theme toggle" class="hidden">Theme</button>
    <button id="logout-button" type="button" aria-label="Logout" class="hidden">Logout</button>
    <button id="script-practice-hiragana" type="button" aria-label="Hiragana practice" class="hidden">Hiragana</button>
    <button id="script-practice-katakana" type="button" aria-label="Katakana practice" class="hidden">Katakana</button>
    <button id="script-practice-kanji" type="button" aria-label="Kanji practice" class="hidden">Kanji</button>
    <div style="display:none !important;">
      <input id="section-filter-input" type="text" autocomplete="off" placeholder="Filter the sections" />
      <span id="dictionary-count">0 words</span>
    </div>
    <main class="mx-auto max-w-7xl px-3 pt-0 pb-2 lg:px-4 lg:pt-0 lg:pb-2">
      <div class="py-2">
        <div id="dictionary-list" class="space-y-2"></div>
      </div>


      <!-- Section note editor (Quill). Ctrl/Cmd+S saves, Esc cancels. -->
      <div id="section-note-modal" class="modal-backdrop fixed inset-0 z-40 items-center justify-center bg-slate-900/60 px-3 py-4" role="dialog" aria-modal="true" aria-labelledby="section-note-title">
        <div class="flex w-full max-w-3xl flex-col rounded-2xl bg-white p-3 shadow-2xl dark:bg-slate-800">
          <div class="mb-2 flex items-center justify-between gap-3">
            <div id="section-note-title" class="truncate text-sm text-slate-600 dark:text-slate-300">Note</div>
            <div class="flex shrink-0 items-center gap-2">
              <button id="section-note-cancel" type="button" class="rounded-md px-3 py-1.5 text-sm text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700">Cancel</button>
              <button id="section-note-save" type="button" class="rounded-md bg-violet-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-violet-700 disabled:opacity-60">Save</button>
            </div>
          </div>
          <div id="section-note-editor" class="bg-white dark:bg-slate-900"></div>
        </div>
      </div>

      <!-- Quick-add: a real modal rather than a widget embedded in a
           section's <summary> — that embedding was the whole reason a
           spacebar keypress could ever be mistaken for a <details> disclosure
           toggle. As a modal it also has one fixed home in the DOM, so it
           needs no reattach-after-rerender dance the way the old widget did. -->
      <div id="quick-add-modal" class="modal-backdrop fixed inset-0 z-30 items-center justify-center bg-slate-900/60 px-4 py-6">
        <div class="w-full max-w-sm rounded-2xl bg-white p-3 shadow-2xl dark:bg-slate-800">
          <div id="quick-add-context" class="hidden mb-2 flex items-center gap-2 rounded-lg bg-emerald-50/80 px-2.5 py-1.5 text-xs font-medium text-emerald-800 dark:bg-emerald-900/25 dark:text-emerald-200" aria-live="polite"></div>
          <div class="flex items-stretch gap-1.5">
            <button id="quick-add-back-btn" type="button" title="Back to the previous stage" class="hidden shrink-0 rounded p-1.5 text-slate-400 hover:bg-slate-100 dark:text-slate-500 dark:hover:bg-slate-700">
              <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a.75.75 0 01-.75.75H4.66l2.1 1.95a.75.75 0 11-1.02 1.1l-3.5-3.25a.75.75 0 010-1.1l3.5-3.25a.75.75 0 111.02 1.1l-2.1 1.95h12.59a.75.75 0 01.75.75z" clip-rule="evenodd"/></svg>
            </button>
            <input id="quick-add-input" type="text" autocomplete="off" class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100" />
            <button id="quick-add-mode-toggle" type="button" class="quick-add-mode-toggle" title="Switch between Japanese/Romaji and English input" aria-label="English meaning input mode" aria-pressed="true">
              <span class="quick-add-mode-knob" aria-hidden="true"></span>
              <span class="quick-add-mode-option quick-add-mode-japanese" aria-hidden="true">あ</span>
              <span class="quick-add-mode-option quick-add-mode-english" aria-hidden="true">A</span>
            </button>
            <button id="quick-add-close" type="button" title="Close" class="quick-add-close-btn">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M6.28 5.22a.75.75 0 10-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 10-1.06-1.06L10 8.94 6.28 5.22z"/></svg>
            </button>
          </div>
          <div id="quick-add-panel" class="hidden mt-2 flex items-start gap-2">
            <div id="quick-add-preview-rows" class="min-w-0 flex-1 space-y-1"></div>
            <button id="quick-add-clear-btn" type="button" title="Cancel" class="shrink-0 rounded p-1 text-slate-400 hover:bg-slate-100 dark:text-slate-500 dark:hover:bg-slate-700">
              <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M6.28 5.22a.75.75 0 10-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 10-1.06-1.06L10 8.94 6.28 5.22z"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Reading: full-screen player with automatic and manual practice modes. -->
      <div id="reading-modal" class="modal-backdrop reading-player" role="dialog" aria-modal="true" aria-label="Reading">
        <div class="reading-top">
          <div id="reading-section" class="reading-section"></div>
          <label class="reading-manual-toggle" title="Hide meanings and move only with the navigation buttons">
            <input id="reading-manual-mode" type="checkbox" aria-label="Manual mode: hide meaning and disable automatic reading" />
            <span>Manual</span>
          </label>
          <button id="reading-close" type="button" class="reading-close" aria-label="Close" title="Close (Esc)">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M6.28 5.22a.75.75 0 10-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 10-1.06-1.06L10 8.94 6.28 5.22z"/></svg>
          </button>
        </div>
        <div class="reading-stage" aria-live="polite">
          <div id="reading-word" class="reading-word">Read</div>
          <div id="reading-pronunciation" class="reading-pronunciation"></div>
          <div id="reading-meaning" class="reading-meaning"></div>
        </div>
        <div class="reading-bottom">
          <div id="reading-position" class="reading-position"></div>
          <div class="reading-controls">
            <button id="reading-prev" type="button" class="reading-btn" aria-label="Previous word" title="Previous word (←)">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg>
            </button>
            <button id="reading-control" type="button" class="reading-btn reading-control" aria-label="Pause reading" title="Pause reading (Space)">
              <svg class="icon-play hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
              <svg class="icon-speaker hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 5 6 9H3v6h3l5 4z"/>
                <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
                <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
              </svg>
            </button>
            <button id="reading-next" type="button" class="reading-btn" aria-label="Next word" title="Next word (→)">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div id="script-practice-modal" class="modal-backdrop fixed inset-0 z-30 items-center justify-center bg-slate-900/60 px-4 py-6">
        <div class="glass-card relative flex h-[85vh] w-full max-w-3xl flex-col overflow-hidden rounded-3xl border border-slate-200 shadow-2xl dark:border-slate-700">
          <div class="flex items-center justify-between border-b border-slate-200 px-4 py-2 dark:border-slate-700">
            <span id="script-practice-title" class="text-sm font-semibold text-slate-900 dark:text-slate-100">Script Practice</span>
            <button id="script-practice-close" type="button" title="Close" class="rounded-full border border-slate-200 bg-slate-100 p-1.5 text-slate-500 hover:bg-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor"><path d="M6.28 5.22a.75.75 0 10-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 10-1.06-1.06L10 8.94 6.28 5.22z"/></svg>
            </button>
          </div>
          <iframe id="script-practice-frame" class="h-full w-full flex-1 border-0" title="Script practice" src="about:blank"></iframe>
        </div>
      </div>
    </main>
  </div>
